<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SPA Vision</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#18223c;--line:#223054;--tx:#e6ecff;--mu:#8a97b8;--ac:#5eb6ff;--ok:#34d399;--wa:#fbbf24;--ba:#f87171;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1760px;margin:0 auto;padding:20px clamp(12px,3vw,40px) 60px}
/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:18px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand p{color:var(--mu);font-size:12px}
#clock{font:600 18px ui-monospace,monospace;color:var(--ac);margin-left:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.btn:hover{background:var(--panel2)}
#q{flex:1;min-width:180px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#src{display:flex;gap:10px;margin-left:auto;color:var(--mu);font-size:11px;flex-wrap:wrap}
#src i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wa);margin-right:4px}
#src i.ok{background:var(--ok)}#src i.er{background:var(--ba)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;transition:.15s}
.kpi:hover{border-color:var(--ac)}
.kpi[aria-pressed=true]{border-color:var(--ac);background:var(--panel2)}
.kpi b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mu);font-size:12px}
.kpi.bad b{color:var(--ba)}.kpi.warn b{color:var(--wa)}.kpi.good b{color:var(--ok)}
/* gauge */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 20px}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.gauge svg{width:100%;max-width:200px;height:auto}
.gauge .val{font:700 24px ui-monospace,monospace;fill:var(--tx)}
.gauge .lbl{font-size:11px;fill:var(--mu)}
.gauge h4{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.spark{width:100%;height:60px;display:block;margin-top:8px}
/* tribunais */
#trib{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:28px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.off::before{background:var(--ba)}
/* grid de clientes */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .15s,border-color .15s;content-visibility:auto;contain-intrinsic-size:auto 190px}
.card:hover{transform:translateY(-2px);border-color:var(--ac)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--ok)}
.card.s1::before{background:var(--ac)}.card.s2::before{background:var(--wa)}.card.s3::before{background:var(--ba)}
.card.s3{box-shadow:0 0 0 1px rgba(248,113,113,.25),0 6px 24px -10px rgba(248,113,113,.4)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch h3{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mu)}
.tag.PGE{color:#f9a8d4}.tag.PGM{color:#86efac}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:var(--panel2);border-radius:10px;padding:8px 10px;min-height:54px}
.m b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m span{font-size:11px;color:var(--mu)}
.m.ok b{color:var(--ok)}.m.wa b{color:var(--wa)}.m.ba b{color:var(--ba)}.m.mu b{color:var(--mu)}
.m.big b{font-size:22px}
.cf{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px}
.chip{font-size:11px;border-radius:6px;padding:2px 7px;background:rgba(251,191,36,.14);color:var(--wa)}
.chip.ba{background:rgba(248,113,113,.16);color:var(--ba)}
.sh{display:inline-block;width:42px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--panel),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;vertical-align:middle}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:50px}
details{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details summary{cursor:pointer;color:var(--mu)}
#fail{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px;padding:10px 14px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);border-radius:var(--r);color:var(--tx);font-size:13px}
#fail[hidden]{display:none}#fail span{flex:1;min-width:220px}#fail b{color:var(--ba)}
.alertbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;width:100%;padding:10px 14px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);border-radius:var(--r);color:var(--ba);font-size:13px}
.tr{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r);padding:12px 14px;margin-top:10px;display:grid;gap:6px}
.tr.off{border-left-color:var(--ba)}
.tr .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tr .th b{font-size:15px;flex:1;min-width:140px}
.tr .tm{color:var(--mu);font-size:12px;overflow-wrap:anywhere}.tr .te{color:var(--ba);font-size:12.5px;overflow-wrap:anywhere}
.tr a{color:var(--ac);font-size:12px;text-decoration:none}.tr a:hover{text-decoration:underline}
details li{list-style:none;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
details ul{margin-top:8px}
/* gaveta */
#ov{position:fixed;inset:0;background:rgba(3,6,15,.6);opacity:0;pointer-events:none;transition:.2s;z-index:20}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(920px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:21;display:flex;flex-direction:column}
body.open #ov{opacity:1;pointer-events:auto}body.open #dr{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px;flex:1}
#sub{color:var(--mu);font-size:12px;padding:8px 20px}
#body{overflow:auto;padding:0 20px 24px;flex:1}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--mu);font-weight:600;text-transform:capitalize;padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top;max-width:380px;overflow-wrap:anywhere}
td.n{font-family:ui-monospace,monospace}td.er{color:var(--ba)}
.bd{padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:40}
#toast div{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:10px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast .ba{border-left-color:var(--ba)}
@media(max-width:600px){#clock{display:none}.kpi b{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>SPA Vision</h1></div>
    <div id="clock" aria-hidden="true"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar cliente  ( / )" aria-label="Buscar cliente" autocomplete="off">
      <div class="seg" id="tipo" role="group" aria-label="Tipo">
        <button data-v="ALL" aria-pressed="true">Todos</button><button data-v="PGE" aria-pressed="false">PGE</button><button data-v="PGM" aria-pressed="false">PGM</button>
      </div>
      <div class="seg" id="per" role="group" aria-label="Período">
        <button data-v="" aria-pressed="true">Padrão</button><button data-v="hoje" aria-pressed="false">Hoje</button><button data-v="semana" aria-pressed="false">7 dias</button><button data-v="mes" aria-pressed="false">Mês</button>
      </div>
      <button class="btn" id="rf" title="Atualizar tudo">↻ Atualizar</button>
      <button class="btn" id="mute" title="Som de alerta" aria-pressed="false">🔔</button>
      <button class="btn" id="fs" title="Tela cheia">⛶</button>
      <a class="btn" href="/checklist" target="_blank" rel="noopener" style="text-decoration:none">Checklist</a>
      <div id="src" aria-label="Estado das fontes"></div>
    </div>
  </header>
  <section class="kpis" id="kpis" aria-label="Indicadores"></section>
  <div id="trib" aria-label="Tribunais"></div>
  <div id="fail" role="alert" hidden></div>
  <main id="grid" aria-live="polite"></main>
  <details id="orf" hidden><summary></summary><ul></ul></details>
</div>
<div id="ov"></div>
<aside id="dr" role="dialog" aria-modal="true" aria-labelledby="dt" aria-hidden="true">
  <div class="dh"><h2 id="dt"></h2>
    <div class="seg" id="tabs" role="group"><button data-t="pend" aria-pressed="true">Pendentes</button><button data-t="rot" aria-pressed="false">Rotina</button><button data-t="blank" aria-pressed="false">Em branco</button><button data-t="trib" aria-pressed="false">Tribunais</button></div>
    <button class="btn" id="x" aria-label="Fechar">✕</button></div>
  <div id="sub"></div><div id="body"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const core=n=>norm(n).replace(/^(pge|pgm)/,'').replace(/homologacao$/,'');
const nf=n=>Number(n).toLocaleString('pt-BR');
// junto com os outros botões
const conn = document.createElement('span');
conn.id='conn';
conn.style.cssText='display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)';
conn.innerHTML='<i style="width:7px;height:7px;border-radius:50%;background:var(--wa)"></i>conectando…';
document.querySelector('.bar').appendChild(conn);
// Associação manual (trecho normalizado de host/app → prefixo) para casos que o nome não resolve sozinho
const ALIASES={pgemt:'MB5'};
const RB=new Set(['NAO RODOU','QUERY_ERROR','AUTH_ERROR','NO_CONFIG']),RW=new Set(['VERIFICAR','SEM_ROTINA','ALERTA']);
const ROT={OK:['Em dia','ok'],'NAO RODOU':['Não rodou','ba'],VERIFICAR:['Verificar','wa'],SEM_ROTINA:['Sem rotina','wa'],ALERTA:['Alerta','wa'],DESATIVADO:['Desativada','mu'],QUERY_ERROR:['Falha','ba'],AUTH_ERROR:['Falha login','ba'],NO_CONFIG:['Sem config','ba']};
const S={err:{},em:{},t:{}};let F='ALL',T='ALL',Q='',P='',prevBad=null,mute=localStorage.getItem('spa:mute')==='1';
const CK='spa:v2';
/* ───────── fontes de dados (carregam em paralelo e hidratam a tela conforme chegam) ───────── */
const qs=()=>{const a=sessionStorage.getItem('spa_inicio'),b=sessionStorage.getItem('spa_fim');return a?`?dataInicio=${a}${b?'&dataFim='+b:''}`:''};
async function j(u,ms=90000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal,headers:{Accept:'application/json'}});
    if(r.status===429)throw new Error('Muitas requisições');if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
const SRC={
  resumo:{every:600,load:()=>j('/processos/resumo'+qs())},
  rotina:{every:120,load:()=>j('/api/rotina/status')},
  blank:{every:600,load:async()=>{const[a,b]=await Promise.allSettled([j('/processos/blank-notices/todos'+qs()),j('/processos/blank-notices'+qs())]);
    if(a.status!=='fulfilled'&&b.status!=='fulfilled')throw 0;const l=a.status==='fulfilled'&&Array.isArray(a.value)?a.value:[];
    if(b.status==='fulfilled'&&b.value&&b.value.prefixo)l.push(b.value);return l}},
  cpu:{every:120,load:async()=>(await j('/api/zabbix/cpu')).data||[]},
  ssl:{every:3600,load:()=>j('/api/status/certificados')},
  errbit:{every:600,load:async()=>(await j('/api/errbit/expedientes')).errors||[]},
  trib:{every:300,load:()=>j('/api/status/tribunais')}
};
const LBL={resumo:'Pendentes',rotina:'Rotinas',blank:'Em branco',cpu:'CPU',ssl:'SSL',errbit:'Errbit',trib:'Tribunais'};
const busy={};
async function run(k){if(busy[k])return;busy[k]=1;
  try{const d=await SRC[k].load();if(!Array.isArray(d))throw 0;S[k]=d;S.err[k]=0;S.t[k]=Date.now();save()}
  catch(e){S.err[k]=1;S.em[k]=(e&&e.name==='AbortError')?'tempo esgotado':(e&&e.message)||'resposta inválida';if(k==='resumo')toast(LBL[k]+': '+S.em[k],'ba')}
  finally{busy[k]=0;render()}}
const all=()=>Object.keys(SRC).forEach(run);
function save(){try{localStorage.setItem(CK,JSON.stringify({p:P,s:Object.fromEntries(Object.keys(SRC).map(k=>[k,S[k]]))}))}catch(_){}}
function hydrate(){try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.p===P)Object.assign(S,c.s)}catch(_){}}
/* ───────── modelo: une todas as fontes por cliente ───────── */
function build(){
  const m=new Map(),get=(p,n)=>{p=String(p||'').toUpperCase();if(!p)return null;let c=m.get(p);
    if(!c){c={p,name:n||p,pend:null,pst:null,rot:null,rtot:0,blank:null,bst:null,cpu:null,ssl:[],err:[],msg:''};m.set(p,c)}if(n&&c.name===c.p)c.name=n;return c};
  (S.resumo||[]).forEach(r=>{const c=get(r.prefixo,r.instancia);if(!c)return;c.pend=r.total_pendentes;c.pst=r.status;if(r.cpu_usage!=null)c.cpu=r.cpu_usage});
  (S.rotina||[]).forEach(r=>{const c=get(r.prefix,r.name);if(!c)return;c.rot=r.status;c.rtot=r.total;if(r.error_message)c.msg=r.error_message});
  (S.blank||[]).forEach(r=>{const c=get(r.prefixo,r.instancia);if(!c)return;c.blank=r.total;c.bst=r.status});
  const L=[...m.values()];
  L.forEach(c=>{c.core=core(c.name);c.type=/^pge/i.test(c.name)?'PGE':/^pgm/i.test(c.name)?'PGM':'OUT';c.hay=norm(c.name+c.p);c.trb=tribDe(c);c.tbad=c.trb.some(t=>t.status!=='OK')});
  const find=t=>{t=norm(t);for(const a in ALIASES)if(t.includes(a)&&m.has(ALIASES[a]))return m.get(ALIASES[a]);
    let b=null;for(const c of L)if(c.core.length>=3&&t.includes(c.core)&&(!b||c.core.length>b.core.length))b=c;return b};
  const orf={ssl:[],err:[]};
  (S.cpu||[]).forEach(x=>{const c=find(x.name);if(c&&c.cpu==null)c.cpu=x.cpu_usage});
  (S.ssl||[]).forEach(x=>{const c=find(x.host);c?c.ssl.push(x):orf.ssl.push(x)});
  (S.errbit||[]).forEach(x=>{const c=find(x.app_name);c?c.err.push(x):orf.err.push(x)});
  L.forEach(c=>{const r=String(c.rot||'').toUpperCase();c.rk=r==='OK'?'OK':r;c.rbad=RB.has(r);c.minssl=c.ssl.length?Math.min(...c.ssl.map(s=>s.dias_restantes)):null;
    c.sev=(c.pst&&c.pst!=='ok')||c.rbad||c.tbad||(c.minssl!==null&&c.minssl<=7)?3:(RW.has(r)||c.blank>0||c.cpu>=85||c.ssl.length||c.err.length)?2:c.pend>0?1:0});
  L.sort((a,b)=>b.sev-a.sev||(b.pend||0)-(a.pend||0)||a.name.localeCompare(b.name,'pt-BR'));
  return{L,orf}}
const FIL={
  ALL:()=>1,
  attn:c=>c.sev>=2,
  pend:c=>(c.pend||0)>0,        
  rot:c=>c.rbad||RW.has(c.rk),
  blank:c=>c.blank>0,
  ssl:c=>c.ssl.length>0,
  err:c=>c.err.length>0
};
/* ───────── render ───────── */
let raf=0;const render=()=>{raf||(raf=requestAnimationFrame(()=>{raf=0;paint()}))};
const ld=(c,k)=>S[k]===undefined&&!S.err[k];
const cell=(c,k,v,cls,lab,big)=>`<div class="m ${big?'big ':''}${v==null?'':cls}"><b>${v!=null?v:ld(c,k)?'<i class="sh"></i>':'—'}</b><span>${lab}</span></div>`;
function paint(){
  const{L,orf}=build();
  const tot=L.reduce((s,c)=>s+(c.pend||0),0),att=L.filter(c=>c.sev>=2).length,rb=L.filter(FIL.rot).length,bl=L.reduce((s,c)=>s+(c.blank||0),0),ss=L.reduce((s,c)=>s+c.ssl.length,0)+orf.ssl.length,er=(S.errbit||[]).length;
  const K=(f,n,l,cls)=>`<button class="kpi ${cls}" data-f="${f}" aria-pressed="${F===f}"><b>${n}</b><span>${l}</span></button>`;
  $('#kpis').innerHTML =
  K('ALL', L.length, 'Monitorados', '') +
  K('attn', att, 'Precisam de atenção', att?'bad':'good') +
  K('pend', nf(tot), 'Expedientes não cadastrados', tot?'warn':'good') +
  K('rot', rb, 'Rotinas com Erro', rb?'bad':'good') +
  K('blank', nf(bl), 'Cadastros em branco', bl?'warn':'good') +
  K('ssl', ss, 'Certificados para vencer', ss?'warn':'good') +
  K('err', er, 'Erros Errbit (hoje)', er?'warn':'good');

  const tribs = S.trib || [];
if (tribs.length) {
  // Agrupa os itens da API pelo nome do cliente
  const porCliente = tribs.reduce((acc, item) => {
    const cli = item.cliente || 'Outros';
    if (!acc[cli]) acc[cli] = [];
    acc[cli].push(item);
    return acc;
  }, {});

  $('#trib').innerHTML = Object.entries(porCliente).map(([cliente, lista]) => {
    // Verifica se algum tribunal do cliente falhou
    const possuiErro = lista.some(t => t.status !== 'OK');
    const statusFront = possuiErro 
      ? '<span style="font-size: 11px; color: var(--wa);">⚠️ Verificar integrações</span>' 
      : '<span style="font-size: 11px; color: var(--ok)</span>';

    return `
      <div style="background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; width: 100%; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <strong style="color: var(--tx); font-size: 14px;">🏢 Cliente: ${esc(cliente)}</strong>
          ${statusFront}
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          ${lista.map(t => `
            <a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
              <span class="pill ${t.status === 'OK' ? '' : 'off'}" 
                    title="HTTP ${esc(t.code ?? '—')}${t.error ? ' · Error: ' + esc(t.error) : ''}">
                ${esc(t.nome)} ·${t.status === 'OK' ? 'online' : 'fora do ar'} ↗
              </span>
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
} else {
  $('#trib').innerHTML = S.err.trib
    ? `<div class="alertbox" role="alert"><span>⚠️ Não foi possível carregar os tribunais (${esc(S.em.trib||'erro')}).</span><button class="btn" data-retry="trib">Tentar novamente</button></div>`
    : ld(0, 'trib')
      ? '<span class="sh"></span>'
      : '<span style="color: var(--mu); font-size: 12px;">Nenhum tribunal retornado ainda (a verificação roda a cada 5 min).</span>';
}

  // ── Estado de cada fonte + faixa de erro (erro NUNCA esconde os cards) ──
  const bad=Object.keys(SRC).filter(k=>S.err[k]);
  $('#src').innerHTML=Object.keys(SRC).map(k=>`<span title="${esc(S.err[k]?(S.em[k]||'falha'):S[k]!==undefined?'ok':'carregando')}"><i class="${S.err[k]?'er':S[k]!==undefined?'ok':''}"></i>${LBL[k]}</span>`).join('');
  const fl=$('#fail');
  fl.hidden=!bad.length;
  fl.innerHTML=bad.length
    ? `<span>⚠️ ${bad.length===1?'Fonte com falha':'Fontes com falha'}: ${bad.map(k=>`<b>${LBL[k]}</b> (${esc(S.em[k]||'erro')})`).join(' · ')}${bad.some(k=>S[k]!==undefined)?' — exibindo os últimos dados salvos.':''}</span><button class="btn" data-retry="all">Tentar novamente</button>`
    : '';

  // ── Cards de clientes ──
  const list=L.filter(c=>(T==='ALL'||c.type===T)&&FIL[F](c)&&(!Q||c.hay.includes(norm(Q))));
  const loading=!L.length&&['resumo','rotina','blank'].some(k=>!S.err[k]&&S[k]===undefined);
  $('#grid').innerHTML=list.length?list.map(card).join(''):loading?skel()
    :L.length?'<p class="empty">Nenhum cliente corresponde aos filtros.</p>'
    :'<p class="empty">Sem dados de clientes. Veja as fontes com falha acima e tente novamente.</p>';

  // ── SSL/Errbit sem cliente associado ──
  const o=$('#orf'),no=orf.ssl.length;
  o.hidden=!no;
  if(no){o.open=true;o.querySelector('summary').textContent=`Certificados sem cliente associado (${no})`;
    o.querySelector('ul').innerHTML=orf.ssl.slice().sort((x,y)=>x.dias_restantes-y.dias_restantes).map(x=>`<li>🔒 ${esc(x.cliente||x.host)} · ${esc(x.host)} · expira em ${esc(x.dias_restantes)} dias</li>`).join('')}
}
const skel=()=>Array(12).fill('<div class="card"><div class="ch"><h3><i class="sh" style="width:140px"></i></h3></div><div class="ms"><div class="m"><i class="sh"></i></div><div class="m"><i class="sh"></i></div><div class="m"><i class="sh"></i></div><div class="m"><i class="sh"></i></div></div></div>').join('');
function card(c){
  const[rl,rc]=ROT[c.rk]||(c.rk?['Verificar','wa']:[null,'']);
  const cpuc=c.cpu==null?'':c.cpu>=85?'ba':c.cpu>=70?'wa':'ok';
  const err=c.pst&&c.pst!=='ok';
  const chips=(c.minssl!==null?`<span class="chip ${c.minssl<=7?'ba':''}" title="${esc(c.ssl.map(s=>s.host).join(', '))}">🔒Certificado expira em ${c.minssl} dias${c.ssl.length>1?` (${c.ssl.length} certificados)`:''}</span>`:'')+/*(c.err.length?`<span class="chip">🐞 ${c.err.length} erro(s)</span>`:'')+*/(c.cpu>=85?'<span class="chip ba">CPU alta</span>':'')+(c.tbad?`<span class="chip ba" title="${esc(c.trb.filter(t=>t.status!=='OK').map(t=>t.nome).join(', '))}">⚖ Tribunal com falha</span>`:'')/*+(err?`<span class="chip ba">⚠ ${esc(c.pst)}</span>`:'')*/;
  return`<article class="card s${c.sev}" role="button" tabindex="0" data-p="${esc(c.p)}" aria-label="${esc(c.name)}: abrir detalhes">
<div class="ch"><h3 title="${esc(c.name)}">${esc(c.name)}</h3>${c.type!=='OUT'?`<span class="tag ${c.type}">${c.type}</span>`:''}</div>
<div class="ms">${cell(c,'resumo',err?'erro':c.pend!=null?nf(c.pend):null,err?'ba':c.pend?'wa':'ok','Pendentes',1)}
${cell(c,'rotina',rl,rc,'Rotina'+(c.rtot?` · ${c.rtot}`:''))}
${cell(c,'blank',c.blank!=null?nf(c.blank):null,c.blank?'wa':'ok','Em branco')}
${cell(c,'cpu',c.cpu!=null?Number(c.cpu).toFixed(0)+'%':null,cpuc,'CPU')}</div>
<div class="cf">${chips}</div></article>`}
/* ───────── gaveta de detalhes (carrega só ao abrir) ───────── */
const DC=new Map();let cur=null,tab='pend';
const DT={pend:p=>`/processos/detalhes/${p}${qs()}`,rot:p=>`/api/rotina/detalhes/${p}`,blank:p=>p==='MB5'?null:`/processos/blank-notices/todos/${p}${qs()}`};
const PR={pend:['judicial_process_number','failure_message','available_at','procedure_id','created_at'],rot:['description','status_rotina','last_start','last_finished','last_processing'],blank:['judicial_process_number','created_at']};
const isoRe=/^\d{4}-\d{2}-\d{2}T/;
const fv=(col,v)=>{if(v==null||v==='')return'—';if(col==='status_rotina'){const[l,k]=ROT[String(v).toUpperCase()]||[v,'mu'];return`<span class="bd" style="color:var(--${k==='ba'?'ba':k==='ok'?'ok':k==='wa'?'wa':'mu'});background:var(--panel2)">${esc(l)}</span>`}
  if(typeof v==='string'&&isoRe.test(v)){const d=new Date(v);if(!isNaN(d))return esc(d.toLocaleString('pt-BR'))}return esc(typeof v==='object'?JSON.stringify(v):v)};
async function open(p){const c=build().L.find(x=>x.p===p);cur=p;$('#dt').textContent=c?c.name:p;document.body.classList.add('open');$('#dr').setAttribute('aria-hidden','false');$('#x').focus();load(tab)}
function close(){document.body.classList.remove('open');$('#dr').setAttribute('aria-hidden','true')}

function renderGauge(elId, series, label, unit){
  const el=document.getElementById(elId); if(!el)return;
  if(!series||!series.length){el.innerHTML=`<h4>${label} · 24h</h4><p class="empty" style="padding:30px 0">Sem dados no Zabbix</p>`;return}
  const last = series[series.length-1].v;
  const pct = Math.max(0, Math.min(100, last));
  const color = pct>=85?'var(--ba)':pct>=70?'var(--wa)':'var(--ok)';
  const R=42, C=2*Math.PI*R, off=C*(1-pct/100);

  // sparkline
  let path='';
  if(series && series.length>1){
    const minT=series[0].t, maxT=series[series.length-1].t;
    const w=200,h=40;
    const pts=series.map(p=>{
      const x=((p.t-minT)/(maxT-minT||1))*w;
      const y=h-((p.v/100)*h);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    path=`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>`;
  }

  el.innerHTML=`
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="10"
        stroke-dasharray="${C}" stroke-dashoffset="${off}"
        stroke-linecap="round" transform="rotate(-90 60 60)"
        style="transition:stroke-dashoffset .4s"/>
      <text x="60" y="58" text-anchor="middle" class="val">${last.toFixed(0)}${unit}</text>
      <text x="60" y="76" text-anchor="middle" class="lbl">${label}</text>
    </svg>
    <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none">${path}</svg>`;
}

/* tribunais do cliente: casa o campo "cliente" do TRIBUNAIS_CONFIG com o nome do card (ex.: "Amargosa" ↔ "PGM Amargosa") */
function tribDe(c){
  if(!c||!c.core)return[];
  return(S.trib||[]).filter(t=>{const n=norm(t.cliente);return n.length>=3&&c.core.length>=3&&(c.core===n||c.core.includes(n)||n.includes(c.core))})}
function renderTribTab(L){
  const c=(L||build().L).find(x=>x.p===cur),body=$('#body'),sub=$('#sub');
  if(!c){body.innerHTML='<p class="empty">Cliente não encontrado.</p>';return}
  if(S.err.trib&&!(S.trib||[]).length){sub.textContent='';body.innerHTML=`<p class="empty" style="color:var(--ba)">Erro ao carregar tribunais: ${esc(S.em.trib||'erro')}<br><button class="btn" style="margin-top:12px" data-retry="trib">Tentar novamente</button></p>`;return}
  if(S.trib===undefined){sub.textContent='Consultando…';body.innerHTML='<p class="empty">Carregando…</p>';return}
  const l=c.trb||[],bad=l.filter(t=>t.status!=='OK').length;
  sub.textContent=l.length?`${nf(l.length)} tribunal(is)${bad?` · ${bad} com falha`:' · todos online'}`:'';
  body.innerHTML=l.length?l.map(t=>{const ok=t.status==='OK';
    return`<div class="tr${ok?'':' off'}"><div class="th"><b>${esc(t.nome)}</b><span class="bd" style="color:var(--${ok?'ok':'ba'});background:var(--panel2)">${ok?'Online':'Fora do ar'}</span></div>
<div class="tm">HTTP ${esc(t.code??'—')}${t.cliente?' · '+esc(t.cliente):''}</div>${t.error?`<div class="te">${esc(t.error)}</div>`:''}
${/^https?:\/\//i.test(t.url||'')?`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Abrir endpoint de teste ↗</a>`:''}</div>`}).join('')
    :'<p class="empty">Nenhum tribunal configurado para este cliente.<br><small>Adicione um item com <code>"cliente": "'+esc(c.core)+'"</code> no TRIBUNAIS_CONFIG.</small></p>'}
async function load(t){
  tab=t;
  $$('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
  if(t==='trib'){renderTribTab();return}
  const body=$('#body'),sub=$('#sub'),u=DT[t](cur);
  if(!u){sub.textContent='';body.innerHTML='<p class="empty">Detalhamento indisponível.</p>';return}

  const key=u,hit=DC.get(key);let d;
  if(hit&&Date.now()-hit.t<60000)d=hit.d;
  else{
    sub.textContent='Consultando…';
    body.innerHTML='<p class="empty">Carregando…</p>';
    try{d=await j(u,60000);DC.set(key,{t:Date.now(),d})}
    catch(e){body.innerHTML=`<p class="empty" style="color:var(--ba)">Erro: ${esc(e.message)}<br><button class="btn" id="retry" style="margin-top:12px">Tentar novamente</button></p>`;return}
  }
  if(!cur||tab!==t||DT[t](cur)!==key)return;

  // ── Gauges de infraestrutura (CPU/Memória) — só na aba Pendentes ──
  let gaugeHtml = '';
  if(t==='pend'){
    gaugeHtml = `
      <div class="gauges">
        <div class="gauge" id="g-cpu"><h4>CPU · 24h</h4><div class="sh" style="height:120px"></div></div>
        <div class="gauge" id="g-mem"><h4>Memória · 24h</h4><div class="sh" style="height:120px"></div></div>
      </div>`;
  }

  const rows=d.processos||d.rotinas||[];
  sub.textContent=`${nf(d.total??rows.length)} registro(s)${d.cached?' · ⚡ cache':''}`;

  if(!rows.length){
    body.innerHTML=gaugeHtml+'<p class="empty">Nenhum registro.</p>';
  }else{
    const cols=Object.keys(rows[0]).filter(c=>c!=='content');
    const pr=PR[t].filter(c=>cols.includes(c));
    const O=pr.concat(cols.filter(c=>!pr.includes(c)));
    const M=300;
    body.innerHTML=gaugeHtml+
      `<table><thead><tr>${O.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0,M).map(r=>`<tr>${O.map(c=>`<td class="${c==='judicial_process_number'?'n':c==='failure_message'?'er':''}">${fv(c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>
      ${rows.length>M?`<p class="empty">Mostrando ${M} de ${nf(rows.length)}.</p>`:''}`;
  }

  // ── Carrega histórico Zabbix em paralelo (não bloqueia) ──
  if(t==='pend'){
    const c = build().L.find(x=>x.p===cur);
    if(c){
      fetch(`/api/zabbix/history/${encodeURIComponent(c.name)}?hours=24`)
        .then(r=>r.ok?r.json():null)
        .then(h=>{
          if(!h)return;
          renderGauge('g-cpu', h.cpu, 'CPU', '%');
          renderGauge('g-mem', h.memory, 'Memória', '%');
        })
        .catch(()=>{});
    }
  }
}

  /* ───────── alertas, período, eventos ───────── */
let ac;function alerta(n){toast('🔴 Rotina com problema: '+n.slice(0,4).join(', ')+(n.length>4?'…':''),'ba',12000);if(mute)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.start();o.stop(ac.currentTime+.6)}catch(_){}}
function toast(m,k='',ms=5000){const d=document.createElement('div');d.className=k;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function setPer(v){P=v;const n=new Date(),a=v==='hoje'?n:v==='semana'?new Date(n-6*864e5):v==='mes'?new Date(n.getFullYear(),n.getMonth(),1):null;
  a?(sessionStorage.setItem('spa_inicio',ymd(a)),sessionStorage.setItem('spa_fim',ymd(n))):(sessionStorage.removeItem('spa_inicio'),sessionStorage.removeItem('spa_fim'));
  DC.clear();['resumo','blank'].forEach(k=>{S[k]=undefined;S.err[k]=0});render();run('resumo');run('blank')}
$('#per').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#per button').forEach(x=>x.setAttribute('aria-pressed',x===b));setPer(b.dataset.v)};
$('#tipo').onclick=e=>{const b=e.target.closest('button');if(!b)return;T=b.dataset.v;$$('#tipo button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#kpis').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;F=F===b.dataset.f?'ALL':b.dataset.f;render()};
$('#grid').onclick=e=>{const c=e.target.closest('.card[data-p]');c&&open(c.dataset.p)};
$('#grid').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card[data-p]');if(c){e.preventDefault();open(c.dataset.p)}}};
$('#tabs').onclick=e=>{const b=e.target.closest('button');b&&cur&&load(b.dataset.t)};
$('#body').onclick=e=>{if(e.target.id==='retry'){DC.delete(DT[tab](cur));load(tab)}};
$('#ov').onclick=$('#x').onclick=close;
document.addEventListener('click',e=>{const b=e.target.closest('[data-retry]');if(!b)return;const k=b.dataset.retry;
  (k==='all'?Object.keys(SRC).filter(x=>S.err[x]):[k]).forEach(x=>{S.err[x]=0;S.em[x]='';run(x)});render()});
$('#rf').onclick=()=>{DC.clear();all();toast('Atualizando…')};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
$('#mute').onclick=()=>{mute=!mute;localStorage.setItem('spa:mute',mute?'1':'0');$('#mute').textContent=mute?'🔕':'🔔';$('#mute').setAttribute('aria-pressed',mute)};
$('#mute').textContent=mute?'🔕':'🔔';
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{Q=e.target.value;render()},120)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();else if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});
/* ───────── ciclo de vida ───────── */
const clk=$('#clock');
setInterval(()=>{
  if(document.hidden)return;
  const n=Date.now();
  for(const k in SRC){
    // rotina e tribunais agora chegam via SSE
    if(k==='rotina'||k==='trib')continue;
    if(!busy[k]&&n-(S.t[k]||0)>SRC[k].every*1000)run(k);
  }
},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=Date.now();for(const k in SRC)if(n-(S.t[k]||0)>SRC[k].every*1000)run(k)}});
sessionStorage.removeItem('spa_inicio');sessionStorage.removeItem('spa_fim');
/* ─── SSE (realtime) ─── */
let es;
function connectSSE(){
  if(es) try{es.close()}catch(_){}
  es = new EventSource('/api/stream');
es.onopen = () => {
  const c = document.getElementById('conn');
  if(c) c.innerHTML='<i style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></i>tempo real';
};
  es.onmessage = e => {
    try{
      const d = JSON.parse(e.data);
      if(Array.isArray(d.tribunais)){
        S.trib = d.tribunais;
        S.t.trib = Date.now();
      }
      if(Array.isArray(d.rotina)){
        // merge por prefix, mantendo os campos que a SSE não traz
        const byP = new Map((S.rotina||[]).map(r=>[r.prefix,r]));
        d.rotina.forEach(r=>{
          const old = byP.get(r.prefix) || {};
          byP.set(r.prefix, {...old, ...r});
        });
        S.rotina = [...byP.values()];
        S.t.rotina = Date.now();
      }
      render();
    }catch(_){}
  };

  es.onerror = () => {
  const c = document.getElementById('conn');
  if(c) c.innerHTML='<i style="width:7px;height:7px;border-radius:50%;background:var(--ba)"></i>reconectando…';
  try{es.close()}catch(_){}
  // Fallback: busca uma vez via REST enquanto o SSE não volta
  run('rotina');
  run('trib');
  setTimeout(connectSSE, 5000);
}};
connectSSE();
hydrate();render();all();   // 1) pinta o último snapshot na hora  2) atualiza todas as fontes em paralelo
})();
</script>
