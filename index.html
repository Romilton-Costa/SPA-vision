<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA — Monitoramento de Expedientes</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:      #0f172a;
            --surface: #1e293b;
            --border:  #334155;
            --text:    #f1f5f9;
            --muted:   #94a3b8;
            --accent:  #38bdf8;
            --green:   #4ade80;
            --pink:    #f472b6;
            --red:     #f87171;
            --yellow:  #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 40px 50px; 
            max-width: 1800px;   
            margin: 0 auto;      
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .header-left h1 {
            font-size: 26px; 
            font-weight: 700;
            color: var(--text);
        }

        .header-left .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ── BADGE CACHE ── */
        #cacheBadge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--muted);
            margin-top: 8px;
        }

        #cacheBadge .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        #cacheBadge.stale .dot { background: var(--yellow); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        /* ── FILTROS ── */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .date-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .date-group label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .date-group input[type="date"] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .date-group input[type="date"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56,189,248,.15);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: .2s;
        }

        .btn:hover { border-color: var(--accent); color: var(--accent); }

        .btn.primary {
            background: var(--accent);
            color: #0f172a;
            border-color: transparent;
            font-weight: 600;
        }

        .btn.primary:hover { opacity: .85; }

        .btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: transparent;
            font-weight: 700;
        }

        /* ── SUMMARY BAR ── */
        .summary-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .summary-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 25px 30px; 
            flex: 1;
            min-width: 250px;   
            border-top: 4px solid var(--accent);
        }

        .summary-card.pge { border-color: var(--pink); }
        .summary-card.pgm { border-color: var(--green); }
        .summary-card.err { border-color: var(--red); }

        .summary-card .label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .summary-card .value {
            font-size: 36px; 
            font-weight: 700;
            margin-top: 8px;
        }

        /* ── GRID DE CARDS ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px; 
            margin-bottom: 32px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px; 
            border-left: 5px solid var(--accent); 
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,.4);
        }

        .card.PGE { border-color: var(--pink); }
        .card.PGM { border-color: var(--green); }
        .card.error { border-color: var(--red); opacity: .7; }

        .card .tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            background: rgba(56,189,248,.15);
            color: var(--accent);
        }

        .card.PGE .tag { background: rgba(244,114,182,.15); color: var(--green); }
        .card.PGM .tag { background: rgba(74,222,128,.15); color: var(--green); }

        .card .name {
            font-size: 18px; 
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card .count {
            font-size: 48px; 
            font-weight: 700;
            color: var(--red);
            line-height: 1;
        }

        .card .count.zero { color: var(--green); }

        .card .count-label {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .card .status-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
        }

        .card .status-dot.error { background: var(--red); }
        .card .status-dot.no_config { background: var(--border); }

        /* ── LOADING OVERLAY ── */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }

        #loadingOverlay.visible { opacity: 1; pointer-events: all; }

        .spinner {
            width: 45px; height: 45px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── CHART ── */
        .chart-wrap {
            background: var(--surface);
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
            height: 400px;
            position: relative;
        }

        .chart-wrap h2 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        /* ── MODAL ── */
        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-bg.open { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: 16px;
            width: 95%;         
            max-width: 1600px;  
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;      
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 28px;
            color: var(--muted);
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }

        .modal-close:hover { color: var(--text); }

        .modal h2 { font-size: 20px; margin-bottom: 8px; }
        .modal .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

        /* ── TABELA ── */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px; 
        }

        th {
            background: #0f172a;
            color: var(--accent);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: #cbd5e1;
            vertical-align: top;
        }

        tr:hover td { background: rgba(56,189,248,.04); }

        .err-msg {
            color: var(--red);
            font-size: 12px;
            max-width: 350px;
            word-break: break-word;
        }

        .num { font-weight: 600; color: var(--text); }

        #nextRefresh {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(10px);
            transition: .3s;
            z-index: 3000;
            pointer-events: none;
        }

        #toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; }
            .header { flex-direction: column; }
            .summary-card { min-width: 100%; }
        }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div></div>
<div id="toast"></div>

<div class="header">
    <div class="header-left">
        <h1>Monitoramento de Expedientes</h1>
        <div class="subtitle">Processos pendentes de notificação · SPA</div>
        <div id="cacheBadge"><span class="dot"></span><span id="cacheLabel">Aguardando dados...</span></div>
        <div id="nextRefresh"></div>
    </div>

    <div class="toolbar">
        <div class="date-group">
            <label>Data início</label>
            <input type="date" id="dataInicio">
        </div>
        <div class="date-group">
            <label>Data fim</label>
            <input type="date" id="dataFim">
        </div>
        <button class="btn primary" onclick="fetchData()">Filtrar</button>
        <button class="btn" onclick="clearDates()">Limpar</button>
        <button class="btn active" data-filter="ALL" onclick="setFilter('ALL', this)">Todos</button>
        <button class="btn" data-filter="PGE" onclick="setFilter('PGE', this)">PGE</button>
        <button class="btn" data-filter="PGM" onclick="setFilter('PGM', this)">PGM</button>
    </div>
</div>
<!--
<div class="summary-bar">
    <div class="summary-card"><div class="label">Total Pendentes</div><div class="value" id="sumTotal">—</div></div>
    <div class="summary-card pge"><div class="label">PGE (Estados)</div><div class="value" id="sumPGE">—</div></div>
    <div class="summary-card pgm"><div class="label">PGM (Municípios)</div><div class="value" id="sumPGM">—</div></div> 
</div>-->

<div class="grid" id="grid"></div>

<!--<div class="chart-wrap">
    <h2>Distribuição por Instância</h2>
    <canvas id="chart" height="120"></canvas>
</div>-->

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModalBtn()">×</button>
        <h2 id="modalTitle">Processos Pendentes</h2>
        <div class="modal-sub" id="modalSub"></div>
        <div id="modalBody"><div style="color:var(--muted);text-align:center;padding:40px">Carregando...</div></div>
    </div>
</div>

<script>
//const API_BASE   = (window.API_BASE || 'http://127.0.0.1:8000').replace(/\/$/, '');

const API_BASE = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
    ? 'http://127.0.0.1:8000'
    : '';
const AUTO_REFRESH_MS = 20 * 60 * 1000; 

let rawData      = [];
let activeFilter = 'ALL';
let chartInst    = null;
let refreshTimer = null;
let nextRefreshAt = null;

function saveDates() {
    const i = document.getElementById('dataInicio').value;
    const f = document.getElementById('dataFim').value;
    try { sessionStorage.setItem('spa_inicio', i); sessionStorage.setItem('spa_fim', f); } catch(_) {}
}

function loadDates() {
    try {
        document.getElementById('dataInicio').value = sessionStorage.getItem('spa_inicio') || '';
        document.getElementById('dataFim').value    = sessionStorage.getItem('spa_fim') || '';
    } catch(_) {}
}

function clearDates() {
    document.getElementById('dataInicio').value = '';
    document.getElementById('dataFim').value    = '';
    try { sessionStorage.removeItem('spa_inicio'); sessionStorage.removeItem('spa_fim'); } catch(_) {}
    fetchData();
}

async function fetchData() {
    saveDates();
    const inicio = document.getElementById('dataInicio').value;
    const fim    = document.getElementById('dataFim').value;

    let url = `${API_BASE}/processos/resumo?t=${Date.now()}`;
    if (inicio) url += `&dataInicio=${inicio}`;
    if (fim)    url += `&dataFim=${fim}`;

    showLoading(true);

    try {
        const res  = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        rawData = data;
        renderAll();

        const isCached = data.length > 0 && data[0].cached;
        updateCacheBadge(isCached);

        scheduleNextRefresh();
    } catch (err) {
        toast(`Erro ao carregar dados: ${err.message}`, 'error');
    } finally {
        showLoading(false);
    }
}

function renderAll() {
    const filtered = rawData.filter(d => {
        if (activeFilter === 'ALL') return true;
        return d.instancia.startsWith(activeFilter);
    });

   // renderSummary(filtered);
    renderGrid(filtered);
    //renderChart(filtered);
}

function renderSummary(data) {
    const total = data.reduce((s, d) => s + (d.total_pendentes || 0), 0);
    const pge   = data.filter(d => d.instancia.startsWith('PGE')).reduce((s,d) => s + (d.total_pendentes||0), 0);
    const pgm   = data.filter(d => d.instancia.startsWith('PGM')).reduce((s,d) => s + (d.total_pendentes||0), 0);

    document.getElementById('sumTotal').textContent = total.toLocaleString('pt-BR');
    document.getElementById('sumPGE').textContent   = pge.toLocaleString('pt-BR');
    document.getElementById('sumPGM').textContent   = pgm.toLocaleString('pt-BR');
}

function renderGrid(data) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!data.length) {
        grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">Nenhuma instância encontrada.</p>';
        return;
    }

    const sorted = [...data].sort((a, b) => (b.total_pendentes || 0) - (a.total_pendentes || 0));

    sorted.forEach(item => {
        const type = item.instancia.startsWith('PGE') ? 'PGE' : 'PGM';
        const isErr = item.status !== 'ok';
        const count = item.total_pendentes || 0;

        const card = document.createElement('div');
        card.className = `card ${type} ${isErr ? 'error' : ''}`;
        card.onclick = () => openDetails(item.prefixo, item.instancia);

        card.innerHTML = `
            <span class="tag">${type}</span>
            <div class="status-dot ${item.status === 'ok' ? '' : item.status}"></div>
            <div class="name">${item.instancia}</div>
            <div class="count ${count === 0 ? 'zero' : ''}">${count.toLocaleString('pt-BR')}</div>
            <div class="count-label">pendente${count !== 1 ? 's' : ''} não cadastrado${count !== 1 ? 's' : ''}</div>
        `;

        grid.appendChild(card);
    });
}

function renderChart(data) {
    const ctx = document.getElementById('chart').getContext('2d');
    if (chartInst) chartInst.destroy();

    const sorted = [...data].sort((a,b)=>(b.total_pendentes||0)-(a.total_pendentes||0));

    chartInst = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: sorted.map(d => d.instancia),
            datasets: [{
                label: 'Pendentes',
                data: sorted.map(d => d.total_pendentes || 0),
                backgroundColor: sorted.map(d =>
                    d.instancia.startsWith('PGE') ? 'rgba(244,114,182,.7)' : 'rgba(74,222,128,.7)'
                ),
                borderRadius: 5,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ${ctx.parsed.y.toLocaleString('pt-BR')} pendentes`
                    }
                }
            },
            scales: {
                y: { beginAtZero: true, grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 } } }
            }
        }
    });
}

async function openDetails(prefix, name) {
    const bg   = document.getElementById('modalBg');
    const body = document.getElementById('modalBody');

    document.getElementById('modalTitle').textContent = name;
    body.innerHTML = '<div style="color:var(--muted);text-align:center;padding:60px">Consultando Metabase...</div>';
    bg.classList.add('open');

    const inicio = document.getElementById('dataInicio').value;
    const fim    = document.getElementById('dataFim').value;

    let url = `${API_BASE}/processos/detalhes/${prefix}`;
    const params = [];
    if (inicio) params.push(`dataInicio=${inicio}`);
    if (fim)    params.push(`dataFim=${fim}`);
    if (params.length) url += '?' + params.join('&');

    try {
        const res    = await fetch(url);
        const result = await res.json();

        document.getElementById('modalSub').textContent =
            `${result.total.toLocaleString('pt-BR')} processo(s) · ${result.cached ? '⚡ do cache' : '🔄 ao vivo'}`;

        if (!result.processos?.length) {
            body.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">Nenhum processo encontrado.</p>';
            return;
        }

        // Filtra as colunas para REMOVER a chave "content"
        const allCols = Object.keys(result.processos[0]);
        const cols = allCols.filter(c => c !== 'content'); // <--- REMOÇÃO AQUI

        const priority = ['judicial_process_number','failure_message','available_at','procedure_id','created_at','identifier'];
        const ordered  = [...priority.filter(c => cols.includes(c)), ...cols.filter(c => !priority.includes(c))];

        let html = `<div class="table-wrap"><table><thead><tr>`;
        ordered.forEach(c => { html += `<th>${c.replace(/_/g,' ')}</th>`; });
        html += `</tr></thead><tbody>`;

        result.processos.forEach(p => {
            html += '<tr>';
            ordered.forEach(c => {
                const v = p[c] ?? '—';
                const cls = c === 'failure_message' ? ' class="err-msg"'
                           : c === 'judicial_process_number' ? ' class="num"' : '';
                html += `<td${cls}>${v}</td>`;
            });
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        body.innerHTML = html;

    } catch (err) {
        body.innerHTML = `<p style="color:var(--red);text-align:center;padding:40px">Erro: ${err.message}</p>`;
    }
}

function closeModal(e) {
    if (e.target === document.getElementById('modalBg')) {
        document.getElementById('modalBg').classList.remove('open');
    }
}

function closeModalBtn() {
    document.getElementById('modalBg').classList.remove('open');
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modalBg').classList.remove('open');
});

function setFilter(type, btn) {
    activeFilter = type;
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
}

function scheduleNextRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    nextRefreshAt = Date.now() + AUTO_REFRESH_MS;
    refreshTimer  = setTimeout(fetchData, AUTO_REFRESH_MS);
    updateNextRefreshLabel();
}

function updateNextRefreshLabel() {
    const el = document.getElementById('nextRefresh');
    if (!nextRefreshAt) { el.textContent = ''; return; }
    const secs = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 1000));
    const min  = Math.floor(secs / 60);
    const sec  = secs % 60;
    el.textContent = `Próxima atualização em ${min}m${sec.toString().padStart(2,'0')}s`;
    setTimeout(updateNextRefreshLabel, 1000);
}

function updateCacheBadge(cached) {
    const badge = document.getElementById('cacheBadge');
    const label = document.getElementById('cacheLabel');
    const now   = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

    if (cached) {
        badge.classList.add('stale');
        label.textContent = `Dados em cache · atualizado antes das ${now}`;
    } else {
        badge.classList.remove('stale');
        label.textContent = `Dados ao vivo · ${now}`;
    }
}

function showLoading(on) {
    document.getElementById('loadingOverlay').classList.toggle('visible', on);
}

function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.borderColor = type === 'error' ? 'var(--red)' : 'var(--border)';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 4000);
}

loadDates();
fetchData();
</script>
</body>
</html>
