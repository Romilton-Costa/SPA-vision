<style>
/* Layout: cabeçalho → faixas de alerta → KPIs clicáveis → filtros → cards por situação; clique abre o painel lateral com detalhamento. */
:root{
  --bg:#0D121C;--bg-2:#111827;--surface:#151D2C;--surface-2:#1B2538;
  --line:#26324A;--line-soft:#1F2A3F;
  --text:#E7ECF5;--muted:#8C98B0;--faint:#5E6A83;
  --accent:#7FA7FF;--accent-soft:rgba(127,167,255,.14);
  --ok:#3FD68F;--ok-soft:rgba(63,214,143,.12);
  --bad:#FF6B72;--bad-soft:rgba(255,107,114,.13);
  --wait:#F2B84B;--wait-soft:rgba(242,184,75,.13);
  --none:#56627A;--scrim:rgba(5,8,14,.72);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(127,167,255,.08),transparent 60%);background-attachment:fixed}
body.open{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:500 12px var(--mono);color:var(--text)}
.c-ok{color:var(--ok)}.c-wa{color:var(--wait)}.c-ba{color:var(--bad)}.c-ac{color:var(--accent)}.c-mu{color:var(--faint)}
.wrap{max-width:1760px;margin:0 auto;padding:22px clamp(16px,3vw,32px) 48px;display:flex;flex-direction:column;gap:18px}

/* Cabeçalho */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.6vw,30px);margin:4px 0 2px;letter-spacing:-.01em}
h1.logo{margin:8px 0 6px;line-height:0}
h1.logo img{height:clamp(40px,4.2vw,52px);width:auto;display:block}
.sub{color:var(--muted);font-size:13px}
.src{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--faint);font-size:11.5px;margin-top:8px}
.src span{display:inline-flex;align-items:center;gap:5px}
.src i,.live i{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
.src i.ok,.live i.ok{background:var(--ok)}.src i.er,.live i.er{background:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.clock{font:600 20px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);height:32px;padding:0 12px;border-radius:7px;font-weight:500;font-size:13px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rng{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.rng[data-on="true"]{border-color:var(--accent)}
.rng input[type=date]{height:32px;border-radius:7px;padding:0 8px;color-scheme:dark;font-size:13px;width:136px}
.rng .go{height:32px;padding:0 12px;border-radius:7px;background:var(--accent-soft);color:var(--accent);border:0;font-weight:600;font-size:13px}
.rng .go:hover{filter:brightness(1.2)}
.btn{background:var(--surface);border:1px solid var(--line);color:var(--text);height:40px;padding:0 14px;border-radius:10px;font:500 13px var(--body);display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.ico{width:40px;padding:0;justify-content:center;color:var(--muted)}
.btn.ico:hover{color:var(--text)}
.btn.ico[aria-pressed="true"]{color:var(--faint)}
.sync{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:12px}
.sync b{color:var(--text);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Alertas */
.alerts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,var(--bad-soft),transparent 70%),var(--surface);border:1px solid rgba(255,107,114,.35);border-radius:12px;padding:10px 12px}
.alerts[hidden]{display:none}
.alerts .lbl{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--bad);display:flex;align-items:center;gap:8px;white-space:nowrap}
.alerts .lbl i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:beat 1.6s ease-in-out infinite}
.alerts.src-fail{background:linear-gradient(90deg,var(--wait-soft),transparent 70%),var(--surface);border-color:rgba(242,184,75,.4)}
.alerts.src-fail .lbl{color:var(--wait)}.alerts.src-fail .lbl i{background:var(--wait);animation:none}
.alerts .txt{flex:1;min-width:220px;font-size:13px;color:var(--muted)}
.alerts .txt b{color:var(--text);font-weight:600}
@keyframes beat{50%{opacity:.35}}
.pills{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 6px;border:1px solid;border-radius:14px;padding:3px 10px;font-size:12px;background:transparent;max-width:100%;text-align:left}
.pill.bad{color:var(--bad);border-color:rgba(255,107,114,.5);background:var(--bad-soft)}
.pill.wait{color:var(--wait);border-color:rgba(242,184,75,.45);background:var(--wait-soft)}
.pill.more{color:var(--muted);border-color:var(--line)}
.pill:hover{filter:brightness(1.15)}
.pill small{opacity:.8;font-family:var(--mono);font-size:11px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color .15s,background .15s;min-width:0}
.kpi:hover{border-color:var(--line)}
.kpi[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--surface)}
.kpi .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.kpi .lbl em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--accent);font-weight:500}
.kpi .val{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .foot{font-size:12px;color:var(--muted)}
.kpi .foot b{font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 12px;font:500 12.5px var(--body);display:inline-flex;gap:6px;align-items:center}
.chip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] b{color:var(--accent)}
.chip.clear{border-style:dashed}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;height:36px;padding:0 12px;font:400 13px var(--body);min-width:0}
.field::placeholder{color:var(--faint)}
#q{width:260px;max-width:100%}

/* Grade de clientes */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:14px}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.group-h b{font-family:var(--mono);color:var(--text)}
.cc{position:relative;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;transition:transform .18s ease,border-color .18s,box-shadow .18s;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 170px}
.cc:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.cc.crit{border-color:rgba(255,107,114,.42);background:radial-gradient(420px 160px at 100% 0%,rgba(255,107,114,.14),transparent 70%),var(--surface)}
.cc.warn{background:radial-gradient(420px 160px at 100% 0%,rgba(242,184,75,.08),transparent 70%),var(--surface)}
.cc-h{display:flex;align-items:flex-start;gap:10px}
.uf{font:600 10.5px var(--mono);letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 6px;flex:none;margin-top:2px}
.uf.PGE{color:#F0A6D4;background:rgba(240,166,212,.12)}
.uf.PGM{color:var(--ok);background:var(--ok-soft)}
.uf.OUT{color:var(--muted);background:var(--line-soft)}
.cc-h .nm{flex:1;min-width:0}
.cc-h h3{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-h .t{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health{font:600 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 8px;flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.health::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.health.crit{color:var(--bad);background:var(--bad-soft)}
.health.crit::before{animation:beat 1.6s ease-in-out infinite}
.health.warn{color:var(--wait);background:var(--wait-soft)}
.health.pend{color:var(--accent);background:var(--accent-soft)}
.health.ok{color:var(--ok);background:var(--ok-soft)}
.tiles{display:grid;grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(0,1fr));gap:6px}
.tile{border-radius:10px;padding:8px 2px 7px;background:var(--bg-2);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tile .v{font:600 16px var(--display);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.tile .v.tx{font-size:11px;line-height:12px;min-height:18px;white-space:normal;text-align:center;display:flex;align-items:center;letter-spacing:-.01em}
.tile .v small{font-size:10.5px;color:var(--muted);font-weight:500}
.tile .k{font-size:9.5px;letter-spacing:0;text-transform:uppercase;color:var(--faint);font-weight:600;line-height:1.2;text-align:center;max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.wide .k{white-space:normal}
.tile.ba{background:var(--bad-soft)}.tile.ba .v{color:var(--bad)}
.tile.wa{background:var(--wait-soft)}.tile.wa .v{color:var(--wait)}
.tile.ok .v{color:var(--ok)}.tile.mu .v{color:var(--muted)}
.cc-f{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;border-top:1px solid var(--line-soft);padding-top:11px}
.why{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why.ba{color:var(--bad)}.why.wa{color:var(--wait)}.why.ok{color:var(--ok)}.why.ac{color:var(--accent)}
.go{color:var(--faint);flex:none;transition:color .15s,transform .15s}
.cc:hover .go{color:var(--accent);transform:translateX(2px)}
.empty{grid-column:1/-1;padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

/* Itens sem cliente associado */
.orf{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px}
.orf[hidden]{display:none}
.orf summary{cursor:pointer;color:var(--muted);font-size:13px}
.orf h4{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.orf ul{list-style:none;margin:0;padding:0}
.orf li{padding:7px 0;border-top:1px solid var(--line-soft);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Carregamento */
.sh{display:inline-block;width:42px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--line-soft),var(--line),var(--line-soft));background-size:200% 100%;animation:sh 1.2s linear infinite;vertical-align:middle}
@keyframes sh{to{background-position:-200% 0}}

/* Painel lateral */
#ov{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(1100px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:41;overflow-y:auto;overscroll-behavior:contain;
  padding:18px clamp(16px,3vw,32px) 32px;display:flex;flex-direction:column;gap:16px;visibility:hidden}
body.open #ov{opacity:1;pointer-events:auto}
body.open #dr{transform:none;visibility:visible}
.d-h{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.d-h .who{display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1}
.d-h h2{font-family:var(--display);font-size:clamp(19px,2.2vw,24px);line-height:1.2;overflow-wrap:anywhere}
.d-h .meta{color:var(--muted);font-size:12.5px;margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.d-h .meta b{color:var(--text);font-weight:500}
.d-h .meta .msg{flex-basis:100%;font-size:12px}
.x{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{color:var(--text);border-color:var(--accent)}
.dk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dk button{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s;min-width:0}
.dk button:hover{border-color:var(--line)}
.dk button[aria-selected="true"]{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent 75%),var(--surface)}
.dk .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.25}
.dk .v{font:600 24px var(--display);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk .v.tx{font-size:17px;line-height:24px}
.dk .v small{font-size:12px;color:var(--muted);font-weight:500}
.dk .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12.5px;color:var(--muted);min-height:18px}
#body{display:flex;flex-direction:column;gap:12px}
.tw{overflow:auto;border:1px solid var(--line-soft);border-radius:12px;max-height:62vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg-2);color:var(--accent);padding:10px 14px;text-align:left;font-weight:600;font-size:12.5px;position:sticky;top:0;z-index:1;white-space:nowrap}
th::first-letter{text-transform:uppercase}
td{padding:10px 14px;border-top:1px solid var(--line-soft);color:#C9D2E3;vertical-align:top;max-width:380px;overflow-wrap:anywhere}
tr:hover td{background:rgba(127,167,255,.04)}
td.n{font:500 12px var(--mono);color:var(--text);white-space:nowrap}
td.er{color:var(--bad);font-size:12px}
.st{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-soft)}.st.ba{color:var(--bad);background:var(--bad-soft)}
.st.wa{color:var(--wait);background:var(--wait-soft)}.st.mu{color:var(--muted);background:var(--line-soft)}
.cbox{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn.sm{height:34px;margin-top:12px}

/* Gauges (Zabbix) */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gauge{align-items:center;text-align:center}
.gauge h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;align-self:flex-start}
.gauge svg{width:100%;max-width:150px;height:auto}
.gauge .val{font:600 22px var(--display);fill:var(--text)}
.gauge .lbl{font-size:11px;fill:var(--muted)}
.spark{width:100%;max-width:none!important;height:56px;display:block}

/* Tribunais e certificados no painel */
.trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft)}
.tr.off{border-color:rgba(255,107,114,.4);background:radial-gradient(300px 120px at 100% 0%,rgba(255,107,114,.1),transparent 70%),var(--surface)}
.dot{grid-row:span 2;width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.tr.off .dot{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.tr b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.tr .tm{font:500 11.5px var(--mono);color:var(--muted)}
.tr .te{grid-column:2/-1;color:var(--bad);font-size:12px;overflow-wrap:anywhere}
.tr a{grid-column:2/-1;color:var(--accent);font-size:12px;text-decoration:none}
.tr a:hover{text-decoration:underline}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.host{font:600 13.5px var(--mono);overflow-wrap:anywhere}
.days{font:700 40px var(--display);line-height:1;font-variant-numeric:tabular-nums}
.days small{font-size:14px;font-weight:500;color:var(--muted)}
.vbar{position:relative;height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.vbar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}

/* Toasts */
#toast{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
#toast div{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast .ba{border-left-color:var(--bad)}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.dk{grid-template-columns:repeat(3,minmax(0,1fr))}.gauges{grid-template-columns:1fr}}
@media (max-width:620px){
  .kpis{grid-template-columns:1fr 1fr}.kpi .val{font-size:24px}
  .dk{grid-template-columns:1fr 1fr}.dk .v{font-size:20px}
  #grid{grid-template-columns:1fr}
  .clock{display:none}
  #q{width:100%}.fr{width:100%}.fr .field{flex:1}
  .alerts .pills{flex-basis:100%}
  #toast{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    </div></div>
    <button class="x" id="x" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

  <div id="sub"></div>
  <div id="body"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const core=n=>norm(n).replace(/^(pge|pgm)/,'').replace(/homologacao$/,'');
const nf=n=>Number(n).toLocaleString('pt-BR');
const pad=n=>String(n).padStart(2,'0');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const setHTML=(el,h)=>{if(typeof el==='string')el=$(el);if(el&&el._h!==h){el.innerHTML=h;el._h=h}};
// Associação manual (trecho normalizado de host/app → prefixo) para casos que o nome não resolve sozinho
const ALIASES={pgemt:'MB5'};
const RB=new Set(['NAO RODOU','QUERY_ERROR','AUTH_ERROR','NO_CONFIG']),RW=new Set(['VERIFICAR','SEM_ROTINA','ALERTA']);
const ROT={OK:['Em dia','ok'],'NAO RODOU':['Não rodou','ba'],VERIFICAR:['Verificar','wa'],SEM_ROTINA:['Sem rotina','wa'],ALERTA:['Alerta','wa'],DESATIVADO:['Desativada','mu'],QUERY_ERROR:['Falha','ba'],AUTH_ERROR:['Falha login','ba'],NO_CONFIG:['Sem config','ba']};
const SEV={3:['crit','Crítico','Críticos'],2:['warn','Atenção','Atenção'],1:['pend','Pendências','Com pendências'],0:['ok','Em dia','Em dia']};
const TYPES=[['ALL','Todos'],['PGM','PGM'],['PGE','PGE'],['OUT','Outros']];
const SSL_ALERT=10; // certificado alerta quando faltam menos de 10 dias para renovação
const sslNum=x=>typeof x.dias_restantes==='number';
const sslK=d=>d<SSL_ALERT?'ba':'ok';
const UFN={ac:'acre',al:'alagoas',ap:'amapa',am:'amazonas',ba:'bahia',ce:'ceara',df:'distritofederal',es:'espiritosanto',go:'goias',ma:'maranhao',mt:'matogrosso',ms:'matogrossodosul',mg:'minasgerais',pa:'para',pb:'paraiba',pr:'parana',pe:'pernambuco',pi:'piaui',rj:'riodejaneiro',rn:'riograndedonorte',rs:'riograndedosul',ro:'rondonia',rr:'roraima',sc:'santacatarina',sp:'saopaulo',se:'sergipe',to:'tocantins'};
const S={err:{},em:{},t:{}};
let F='ALL',T='ALL',Q='',P='',SORT=lsGet('spa:sort')||'sev',alertsAll=false,prevBad=null,mute=lsGet('spa:mute')==='1';
const CK='spa:v2';
const ICON={
  bell:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  off:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0M2 2l20 20"/></svg>'
};

/* ───────── fontes de dados (carregam em paralelo e hidratam a tela conforme chegam) ───────── */
const qs=()=>{const a=sessionStorage.getItem('spa_inicio'),b=sessionStorage.getItem('spa_fim');return a?`?dataInicio=${a}${b?'&dataFim='+b:''}`:''};
async function j(u,ms=90000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{signal:c.signal,headers:{Accept:'application/json'}});
    if(r.status===429)throw new Error('Muitas requisições');if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
const SRC={
  resumo:{every:600,load:()=>j('/processos/resumo'+qs())},
  rotina:{every:120,load:()=>j('/api/rotina/status')},
  blank:{every:600,load:async()=>{const[a,b]=await Promise.allSettled([j('/processos/blank-notices/todos'+qs()),j('/processos/blank-notices'+qs())]);
    if(a.status!=='fulfilled'&&b.status!=='fulfilled')throw 0;const l=a.status==='fulfilled'&&Array.isArray(a.value)?a.value:[];
    if(b.status==='fulfilled'&&b.value&&b.value.prefixo)l.push(b.value);return l}},
  cpu:{every:120,load:async()=>(await j('/api/zabbix/cpu')).data||[]},
  ssl:{every:3600,load:()=>j('/api/status/certificados')},
  trib:{every:300,load:()=>j('/api/status/tribunais')}
};
const LBL={resumo:'Expedientes não cadastrados',rotina:'Rotinas',blank:'Em branco',cpu:'CPU',ssl:'SSL',trib:'Tribunais'};
const busy={};
const gen={};
async function run(k){const my=gen[k]=(gen[k]||0)+1;busy[k]=1;render();   // cada chamada invalida as anteriores
  try{const d=await SRC[k].load();if(my!==gen[k])return;if(!Array.isArray(d))throw 0;S[k]=d;S.err[k]=0;S.t[k]=Date.now();save()}
  catch(e){if(my!==gen[k])return;S.err[k]=1;S.em[k]=(e&&e.name==='AbortError')?'tempo esgotado':(e&&e.message)||'resposta inválida';if(k==='resumo')toast(LBL[k]+': '+S.em[k],'ba')}
  finally{if(my===gen[k]){busy[k]=0;render()}}}
const all=()=>Object.keys(SRC).forEach(run);
function save(){try{localStorage.setItem(CK,JSON.stringify({p:P,s:Object.fromEntries(Object.keys(SRC).map(k=>[k,S[k]]))}))}catch(_){}}
function hydrate(){try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.p===P)Object.assign(S,c.s)}catch(_){}}

/* ───────── modelo: une todas as fontes por cliente ───────── */
function build(){
  const m=new Map(),get=(p,n)=>{p=String(p||'').toUpperCase();if(!p)return null;let c=m.get(p);
    if(!c){c={p,name:n||p,pend:null,pst:null,rot:null,rtot:0,blank:null,bst:null,cpu:null,ssl:[],msg:''};m.set(p,c)}if(n&&c.name===c.p)c.name=n;return c};
  (S.resumo||[]).forEach(r=>{const c=get(r.prefixo,r.instancia);if(!c)return;c.pend=r.total_pendentes;c.pst=r.status;if(r.cpu_usage!=null)c.cpu=r.cpu_usage});
  (S.rotina||[]).forEach(r=>{const c=get(r.prefix,r.name);if(!c)return;c.rot=r.status;c.rtot=r.total;if(r.error_message)c.msg=r.error_message});
  (S.blank||[]).forEach(r=>{const c=get(r.prefixo,r.instancia);if(!c)return;c.blank=r.total;c.bst=r.status});
  const L=[...m.values()],used=new Set();
  L.forEach(c=>{c.core=core(c.name);c.type=/^pge/i.test(c.name)?'PGE':/^pgm/i.test(c.name)?'PGM':'OUT';c.hay=norm(c.name+c.p);
    c.trb=tribDe(c);c.trb.forEach(t=>used.add(t));c.tbadN=c.trb.filter(t=>t.status!=='OK').length;c.tbad=c.tbadN>0});
  const find=t=>{t=norm(t);for(const a in ALIASES)if(t.includes(a)&&m.has(ALIASES[a]))return m.get(ALIASES[a]);
    let b=null;for(const c of L)if(c.core.length>=3&&t.includes(c.core)&&(!b||c.core.length>b.core.length))b=c;return b};
  const orf={ssl:[],trib:(S.trib||[]).filter(t=>!used.has(t))};
  (S.cpu||[]).forEach(x=>{const c=find(x.name);if(c&&c.cpu==null)c.cpu=x.cpu_usage});
  // certificado → card: 1) nome do cliente no host  2) spa.pge.UF.gov.br → PGE do estado  3) subdomínio contido no nome do cliente
  const findHost=h=>{const raw=String(h||'').toLowerCase(),c1=find(raw);if(c1)return c1;
    const g=raw.match(/(?:^|\.)pge?\.([a-z]{2})\.gov\.br$/);
    if(g){const uf=g[1],nm=UFN[uf],pg=L.filter(c=>/^pg/i.test(c.name)&&!/^pgm/i.test(c.name));
      const hit=pg.find(c=>nm&&c.core.includes(nm))||pg.find(c=>norm(c.name).endsWith(uf));if(hit)return hit}
    const lab=raw.split('.').find(x=>!['spa','pgm','pge','pg','www','licenciamento','dividaativa'].includes(x));
    if(lab&&lab.length>=4){const n=norm(lab),cs=L.filter(c=>c.core.includes(n));if(cs.length)return cs.find(c=>c.core===n)||cs.sort((a,b)=>a.core.length-b.core.length)[0]}
    return null};
  (S.ssl||[]).forEach(x=>{const c=findHost(x.host);c?c.ssl.push(x):orf.ssl.push(x)});
  L.forEach(c=>{const r=String(c.rot||'').toUpperCase();c.rk=r==='OK'?'OK':r;c.rbad=RB.has(r);const so=c.ssl.filter(sslNum);c.minssl=so.length?Math.min(...so.map(s=>s.dias_restantes)):null;c.sslErr=c.ssl.length>0&&!so.length;
    c.sev=(c.pst&&c.pst!=='ok')||c.rbad||c.tbad||(c.minssl!==null&&c.minssl<SSL_ALERT)?3:(RW.has(r)||c.blank>0||c.cpu>=85||c.sslErr)?2:c.pend>0?1:0});
  L.sort(SORTS.sev);
  return{L,orf}}
const SORTS={
  sev:(a,b)=>b.sev-a.sev||(b.pend||0)-(a.pend||0)||a.name.localeCompare(b.name,'pt-BR'),
  name:(a,b)=>a.name.localeCompare(b.name,'pt-BR'),
  pend:(a,b)=>(b.pend||0)-(a.pend||0)||a.name.localeCompare(b.name,'pt-BR'),
  blank:(a,b)=>(b.blank||0)-(a.blank||0)||a.name.localeCompare(b.name,'pt-BR'),
  ssl:(a,b)=>(a.minssl??1e9)-(b.minssl??1e9)||a.name.localeCompare(b.name,'pt-BR'),
  cpu:(a,b)=>(b.cpu??-1)-(a.cpu??-1)||a.name.localeCompare(b.name,'pt-BR')
};
const FIL={
  ALL:()=>1,
  pend:c=>(c.pend||0)>0,
  rot:c=>c.rbad||RW.has(c.rk),
  blank:c=>c.blank>0,
  trib:c=>c.tbad,
  ssl:c=>c.minssl!==null&&c.minssl<SSL_ALERT
};
const rotOf=c=>ROT[c.rk]||(c.rk?['Verificar','wa']:[null,'']);
const ld=k=>S[k]===undefined&&!S.err[k];
const val=(k,v)=>v!=null?v:ld(k)?'<i class="sh"></i>':'—';
function perTxt(){const a=sessionStorage.getItem('spa_inicio'),b=sessionStorage.getItem('spa_fim');
  const f=s=>s?s.split('-').reverse().join('/'):'';
  return P==='hoje'?`hoje (${f(a)})`:P==='semana'?`últimos 7 dias (${f(a)} a ${f(b)})`:P==='mes'?`mês atual (${f(a)} a ${f(b)})`:P==='30d'?`últimos 30 dias (${f(a)} a ${f(b)})`:P==='mesant'?`mês anterior (${f(a)} a ${f(b)})`:P==='custom'?(a===b?f(a):`${f(a)} a ${f(b)}`):'padrão'}

/* ───────── render ───────── */
let raf=0;const render=()=>{raf||(raf=requestAnimationFrame(()=>{raf=0;paint()}))};
function paint(){
  const{L,orf}=build();
  paintHeader(L);
  paintFail();
  paintAlerts(L);
  paintKpis(L,orf);
  paintChips(L);
  paintGrid(L);
  paintOrf(orf);
  if(cur&&document.body.classList.contains('open')){paintDrawerHead(L);if(tab==='trib')renderTribTab(L);else if(tab==='ssl')renderSslTab(L)}
}
function paintHeader(L){
  $('#subtitle').textContent=L.length?`${L.length} clientes monitorados · período: ${perTxt()}`:ld('resumo')?'Carregando clientes…':'Nenhum cliente carregado';
  setHTML('#src',Object.keys(SRC).map(k=>`<span title="${esc(S.err[k]?(S.em[k]||'falha'):S[k]!==undefined?'ok':'carregando')}"><i class="${S.err[k]?'er':S[k]!==undefined?'ok':''}"></i>${LBL[k]}</span>`).join(''));
  const ts=Math.max(0,...Object.values(S.t));
  $('#lastSync').textContent=ts?new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—';
  $('#rfi').classList.toggle('spin',Object.values(busy).some(Boolean));
}
function paintFail(){
  const bad=Object.keys(SRC).filter(k=>S.err[k]),fl=$('#fail');
  fl.hidden=!bad.length;
  setHTML(fl,bad.length
    ?`<span class="lbl"><i></i>${bad.length===1?'Fonte com falha':'Fontes com falha'}</span><span class="txt">${bad.map(k=>`<b>${LBL[k]}</b> (${esc(S.em[k]||'erro')})`).join(' · ')}${bad.some(k=>S[k]!==undefined)?' · exibindo os últimos dados salvos.':''}</span><button class="btn sm" style="margin:0" data-retry="all">Tentar novamente</button>`
    :'');
}
function paintAlerts(L){
  const items=[];
  L.forEach(c=>{const w=[];let tab=null,s=0;
    if(c.pst&&c.pst!=='ok'){w.push('erro nos expedientes não cadastrados');tab=tab||'pend';s+=3}
    if(c.rbad){w.push('rotina: '+rotOf(c)[0].toLowerCase());tab=tab||'rot';s+=3}
    if(c.tbad){w.push(c.tbadN+(c.tbadN>1?' tribunais fora':' tribunal fora'));tab=tab||'trib';s+=2}
    if(c.minssl!==null&&c.minssl<SSL_ALERT){w.push('SSL '+c.minssl+'d');tab=tab||'ssl';s+=2}
    if(w.length)items.push({c,tab,s,sm:w.join(' · ')})});
  items.sort((a,b)=>b.s-a.s||a.c.name.localeCompare(b.c.name,'pt-BR'));
  $('#alerts').hidden=!items.length;
  const LIM=10,shown=alertsAll?items:items.slice(0,LIM);
  setHTML('#alertPills',shown.map(p=>`<button class="pill bad" data-open="${esc(p.c.p)}" data-tab="${p.tab}">${esc(p.c.name)} <small>· ${esc(p.sm)}</small></button>`).join('')
    +(items.length>LIM?`<button class="pill more" data-more>${alertsAll?'Mostrar menos':'+'+(items.length-LIM)+' clientes'}</button>`:''));
}
function paintKpis(L,orf){
  const sum=f=>L.reduce((s,c)=>s+(f(c)||0),0),cnt=f=>L.filter(f).length;
  const tot=sum(c=>c.pend),bl=sum(c=>c.blank);
  const rBad=cnt(c=>c.rbad),rWarn=cnt(c=>RW.has(c.rk)),rOk=cnt(c=>c.rk==='OK'),rAll=rBad+rWarn+rOk;
  const tAll=(S.trib||[]).length,tOff=(S.trib||[]).filter(t=>t.status!=='OK').length;
  const sAll=S.ssl||[],sNum=sAll.filter(sslNum),sAl=sNum.filter(x=>x.dias_restantes<SSL_ALERT).length,sMin=sNum.length?Math.min(...sNum.map(x=>x.dias_restantes)):null,sErr=sAll.length-sNum.length;
  const pc=(n,d)=>d?(n/d*100)+'%':'0';
  const K=(f,lbl,v,cls,foot,bar='')=>`<button class="kpi" data-f="${f}" aria-pressed="${F===f}"><div class="lbl">${lbl}<em>${F===f?'filtrando':'filtrar'}</em></div><div class="val ${cls}">${v}</div>${bar}<div class="foot">${foot}</div></button>`;
  setHTML('#kpis',
    K('pend','Expedientes não cadastrados',val('resumo',S.resumo?nf(tot):null),tot?'c-wa':'c-ok',`em <b>${cnt(FIL.pend)}</b> ${cnt(FIL.pend)===1?'cliente':'clientes'}${P?' · no período':''}`)
   +K('rot','Rotinas',val('rotina',S.rotina?rBad:null)+'<small> com erro</small>',rBad?'c-ba':'c-ok',
      `<b class="c-ba">${rBad}</b> com erro · <b class="c-wa">${rWarn}</b> verificar · ${rAll} rotinas`,
      `<div class="bar"><i style="width:${pc(rOk,rAll)};background:var(--ok)"></i><i style="width:${pc(rWarn,rAll)};background:var(--wait)"></i><i style="width:${pc(rBad,rAll)};background:var(--bad)"></i></div>`)
   +K('blank','Cadastros em branco',val('blank',S.blank?nf(bl):null),bl?'c-wa':'c-ok',`em <b>${cnt(FIL.blank)}</b> ${cnt(FIL.blank)===1?'cliente':'clientes'}`)
   +K('trib','Tribunais',val('trib',S.trib?tOff:null)+'<small> fora do ar</small>',tOff?'c-ba':'c-ok',
      `${tAll} integrações · <b>${cnt(FIL.trib)}</b> ${cnt(FIL.trib)===1?'cliente afetado':'clientes afetados'}`,
      `<div class="bar"><i style="width:${pc(tAll-tOff,tAll)};background:var(--ok)"></i><i style="width:${pc(tOff,tAll)};background:var(--bad)"></i></div>`)
   +K('ssl','Certificados',val('ssl',S.ssl?sAl:null)+`<small> com menos de ${SSL_ALERT} dias</small>`,sAl?'c-ba':'c-ok',`${sNum.length} monitorados${sMin!=null?` · menor prazo <b>${sMin} dias</b>`:''}${sErr?` · <b class="c-wa">${sErr}</b> sem resposta`:''}`));
}
function paintChips(L){
  const n=t=>t==='ALL'?L.length:L.filter(c=>c.type===t).length;
  setHTML('#tipo',TYPES.filter(([k])=>k==='ALL'||n(k)).map(([k,l])=>`<button class="chip" data-v="${k}" aria-pressed="${T===k}">${l} <b>${n(k)}</b></button>`).join('')
    +(F!=='ALL'||Q||T!=='ALL'?'<button class="chip clear" data-clear>Limpar filtros ✕</button>':''));
}
function paintGrid(L){
  const list=L.filter(c=>(T==='ALL'||c.type===T)&&FIL[F](c)&&(!Q||c.hay.includes(norm(Q))));
  const loading=!L.length&&['resumo','rotina','blank'].some(k=>ld(k));
  let html='';
  if(list.length){
    list.sort(SORTS[SORT]||SORTS.sev);
    if(SORT==='sev')[3,2,1,0].forEach(s=>{const g=list.filter(c=>c.sev===s);if(g.length)html+=`<div class="group-h">${SEV[s][2]} <b>${g.length}</b></div>`+g.map(card).join('')});
    else html=list.map(card).join('');
  }else html=loading?skel()
    :L.length?'<p class="empty">Nenhum cliente corresponde aos filtros. <button class="chip" data-clear>Limpar filtros</button></p>'
    :'<p class="empty">Sem dados de clientes. Veja as fontes com falha acima e tente novamente.</p>';
  setHTML('#grid',html);
}
function paintOrf(orf){
  const o=$('#orf'),ns=orf.ssl.length,nt=orf.trib.length;
  o.hidden=!(ns||nt);
  if(!(ns||nt))return;
  o.querySelector('summary').textContent=`Itens sem cliente associado (${ns+nt})`;
  setHTML('#orfBody',
    (ns?`<h4>Certificados · ${ns}</h4><ul>${orf.ssl.slice().sort((x,y)=>(sslNum(x)?x.dias_restantes:1e9)-(sslNum(y)?y.dias_restantes:1e9)).map(x=>`<li><span class="st ${sslNum(x)?sslK(x.dias_restantes):'mu'}">${sslNum(x)?esc(x.dias_restantes)+' dias':'sem resposta'}</span>${esc(x.cliente||x.host)} · <code>${esc(x.host)}</code></li>`).join('')}</ul>`:'')
   +(nt?`<h4>Tribunais · ${nt}</h4><ul>${orf.trib.map(t=>`<li><span class="st ${t.status==='OK'?'ok':'ba'}">${t.status==='OK'?'Online':'Fora do ar'}</span>${esc(t.cliente||'—')} · ${esc(t.nome)}</li>`).join('')}</ul>`:''));
}
const skel=()=>Array(9).fill('<div class="cc" style="cursor:default"><div class="cc-h"><span class="sh" style="width:34px"></span><div class="nm"><span class="sh" style="width:160px"></span></div></div><div class="tiles">'+'<div class="tile"><i class="sh" style="width:28px"></i></div>'.repeat(5)+'</div><div class="cc-f"><span class="sh" style="width:120px;height:12px"></span></div></div>').join('');
function tile(k,v,cls,lab,title,txt){return`<div class="tile${lab.length>12?' wide':''} ${v==null?'':cls}" title="${esc(title)}"><span class="v${txt?' tx':''}">${val(k,v)}</span><span class="k">${lab}</span></div>`}
function why(c){const w=[],rl=rotOf(c)[0];
  if(c.pst&&c.pst!=='ok')w.push(['ba','Erro ao consultar expedientes não cadastrados']);
  if(c.rbad)w.push(['ba','Rotina: '+rl]);
  if(c.tbad)w.push(['ba',c.tbadN+(c.tbadN>1?' tribunais fora do ar':' tribunal fora do ar')]);
  if(c.minssl!==null&&c.minssl<SSL_ALERT)w.push(['ba',`SSL vence em ${c.minssl} dias`]);
  if(RW.has(c.rk))w.push(['wa','Rotina: '+rl]);
  if(c.cpu>=85)w.push(['wa',`CPU alta (${Number(c.cpu).toFixed(0)}%)`]);
  if(c.sslErr)w.push(['wa','Falha ao verificar o certificado']);
  if(c.blank>0)w.push(['wa',`${nf(c.blank)} em branco`]);
  if(c.pend>0)w.push(['ac',`${nf(c.pend)} ${c.pend>1?'expedientes não cadastrados':'expediente não cadastrado'}`]);
  if(!w.length)return['ok','Tudo em dia'];
  return[w[0][0],w.slice(0,2).map(x=>x[1]).join(' · ')+(w.length>2?` · +${w.length-2}`:'')]}
function card(c){
  const[rl,rc]=rotOf(c),[h,hl]=SEV[c.sev],[wc,wt]=why(c);
  const err=c.pst&&c.pst!=='ok';
  const cpuc=c.cpu==null?'':c.cpu>=85?'ba':c.cpu>=70?'wa':'ok';
  const sslv=c.minssl!=null?c.minssl+'<small>d</small>':c.sslErr?'erro':S.ssl!==undefined?'—':null;
  const sslc=c.minssl!=null?sslK(c.minssl):'mu';
  const nt=c.trb.length;
  return`<article class="cc ${h}" role="button" tabindex="0" data-p="${esc(c.p)}" aria-label="${esc(c.name)}: abrir detalhes">
<div class="cc-h"><span class="uf ${c.type}">${c.type==='OUT'?'—':c.type}</span><div class="nm"><h3 title="${esc(c.name)}">${esc(c.name)}</h3><div class="t">${esc(c.p)}${nt?(c.tbad?` · <span class="c-ba">${c.tbadN}/${nt} tribuna${nt>1?'is':'l'} fora</span>`:` · ${nt} tribuna${nt>1?'is':'l'}`):''}</div></div><span class="health ${h}">${hl}</span></div>
<div class="tiles">
${tile('resumo',err?'erro':c.pend!=null?nf(c.pend):null,err?'ba':c.pend?'wa':'ok','Expedientes não cadastrados','Expedientes não cadastrados')}
${tile('rotina',rl,rc,'Rotina',(c.msg||'Status da rotina')+(c.rtot?` · total: ${c.rtot}`:''),1)}
${tile('blank',c.blank!=null?nf(c.blank):null,c.blank?'wa':'ok','Branco','Cadastros em branco')}
${tile('ssl',sslv,sslc,'SSL',c.ssl.length?'Dias para renovação · '+c.ssl.map(s=>`${s.host}: ${sslNum(s)?s.dias_restantes+' dias':'sem resposta'}`).join(' · '):'URL sem certificado monitorado')}
${tile('cpu',c.cpu!=null?Number(c.cpu).toFixed(0)+'<small>%</small>':null,cpuc,'CPU','Uso de CPU (Zabbix)')}
</div>
<div class="cc-f"><span class="why ${wc}" title="${esc(wt)}">${esc(wt)}</span><span class="go">Detalhes →</span></div></article>`}

/* ───────── painel de detalhes (carrega só ao abrir) ───────── */
const DC=new Map();let cur=null,tab='pend',lastFocus=null;
const DT={pend:p=>`/processos/detalhes/${p}${qs()}`,rot:p=>`/api/rotina/detalhes/${p}`,blank:p=>p==='MB5'?null:`/processos/blank-notices/todos/${p}${qs()}`};
const PR={pend:['judicial_process_number','failure_message','available_at','procedure_id','created_at'],rot:['description','status_rotina','last_start','last_finished','last_processing'],blank:['judicial_process_number','created_at']};
const isoRe=/^\d{4}-\d{2}-\d{2}T/;
const fv=(col,v)=>{if(v==null||v==='')return'—';if(col==='status_rotina'){const[l,k]=ROT[String(v).toUpperCase()]||[v,'mu'];return`<span class="st ${k}">${esc(l)}</span>`}
  if(typeof v==='string'&&isoRe.test(v)){const d=new Date(v);if(!isNaN(d))return esc(d.toLocaleString('pt-BR'))}return esc(typeof v==='object'?JSON.stringify(v):v)};
const findCur=L=>(L||build().L).find(x=>x.p===cur);
function tabsHTML(c){
  const[rl,rc]=rotOf(c),err=c.pst&&c.pst!=='ok',nt=c.trb.length;
  const b=(k,lab,v,cls,sub,txt)=>`<button role="tab" data-t="${k}" aria-selected="${tab===k}"><span class="k">${lab}</span><span class="v${txt?' tx':''} c-${cls}">${v}</span><span class="s">${sub}</span></button>`;
  return b('pend','Expedientes não cadastrados',val('resumo',err?'erro':c.pend!=null?nf(c.pend):null),err?'ba':c.pend?'wa':'ok',P?'no período':'total atual')
    +b('rot','Rotina',val('rotina',rl),rc||'mu',c.rtot?`total: ${nf(c.rtot)}`:'status da rotina',1)
    +b('blank','Em branco',val('blank',c.blank!=null?nf(c.blank):null),c.blank?'wa':'ok','cadastros em branco')
    +b('trib','Tribunais',val('trib',nt?`${nt-c.tbadN}<small>/${nt}</small>`:null),c.tbad?'ba':nt?'ok':'mu',c.tbad?`${c.tbadN} fora do ar`:nt?'todos online':'sem configuração')
    +b('ssl','Certificado',val('ssl',c.minssl!=null?`${c.minssl}<small> dias</small>`:c.sslErr?'erro':S.ssl!==undefined?'—':null),c.minssl!=null?sslK(c.minssl):'mu',c.minssl!=null?(c.minssl<SSL_ALERT?'renovar agora':'para renovação'):c.sslErr?'falha na verificação':'URL não monitorada');
}
function paintDrawerHead(L){
  const c=findCur(L);
  if(!c){$('#dt').textContent=cur||'';return}
  const[h,hl]=SEV[c.sev],t=$('#dtype');
  t.textContent=c.type==='OUT'?'—':c.type;t.className='uf '+c.type;
  $('#dt').textContent=c.name;
  setHTML('#dmeta',`<span class="health ${h}">${hl}</span><span><code></code></span><span>Período: <b>${esc(perTxt())}</b></span>${c.msg?`<span class="msg c-ba">${esc(c.msg)}</span>`:''}`);
  setHTML('#tabs',tabsHTML(c));
}
function open(p,t){
  cur=p;lastFocus=document.activeElement;
  document.body.classList.add('open');$('#dr').setAttribute('aria-hidden','false');$('#dr').scrollTop=0;
  load(t||tab);$('#x').focus()}
function close(){if(!document.body.classList.contains('open'))return;document.body.classList.remove('open');$('#dr').setAttribute('aria-hidden','true');if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}

function renderGauge(elId,series,label,unit){
  const el=document.getElementById(elId);if(!el)return;
  if(!series||!series.length){el.innerHTML=`<h4>${label} · 24h</h4><p style="color:var(--muted);padding:30px 0">Sem dados no Zabbix</p>`;return}
  const last=series[series.length-1].v;
  const pct=Math.max(0,Math.min(100,last));
  const color=pct>=85?'var(--bad)':pct>=70?'var(--wait)':'var(--ok)';
  const R=42,C=2*Math.PI*R,off=C*(1-pct/100);
  let path='';
  if(series.length>1){
    const minT=series[0].t,maxT=series[series.length-1].t,w=200,h=40;
    const pts=series.map(p=>`${(((p.t-minT)/(maxT-minT||1))*w).toFixed(1)},${(h-((p.v/100)*h)).toFixed(1)}`).join(' ');
    path=`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>`;
  }
  el.innerHTML=`<h4>${label} · 24h</h4>
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line-soft)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-dasharray="${C}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .4s"/>
      <text x="60" y="62" text-anchor="middle" class="val">${last.toFixed(0)}${unit}</text>
      <text x="60" y="80" text-anchor="middle" class="lbl">agora</text>
    </svg>
    <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none">${path}</svg>`;
}

/* tribunais do cliente: casa o campo "cliente" do TRIBUNAIS_CONFIG com o nome do card (ex.: "Amargosa" ↔ "PGM Amargosa") */
function tribDe(c){
  if(!c||!c.core)return[];
  return(S.trib||[]).filter(t=>{const n=norm(t.cliente);return n.length>=3&&c.core.length>=3&&(c.core===n||c.core.includes(n)||n.includes(c.core))})}
function renderTribTab(L){
  const c=findCur(L),body=$('#body'),sub=$('#sub');
  if(!c){setHTML(body,'<p class="empty">Cliente não encontrado.</p>');return}
  if(S.err.trib&&!(S.trib||[]).length){sub.textContent='';setHTML(body,`<p class="empty c-ba">Erro ao carregar tribunais: ${esc(S.em.trib||'erro')}<br><button class="btn sm" data-retry="trib">Tentar novamente</button></p>`);return}
  if(S.trib===undefined){sub.textContent='Consultando…';setHTML(body,'<p class="empty">Carregando…</p>');return}
  const l=c.trb||[],bad=c.tbadN;
  sub.textContent=l.length?`${nf(l.length)} tribunal(is)${bad?` · ${bad} com falha`:' · todos online'}`:'';
  setHTML(body,l.length?`<div class="trs">${l.slice().sort((a,b)=>(a.status==='OK')-(b.status==='OK')).map(t=>{const ok=t.status==='OK';
    return`<div class="tr${ok?'':' off'}"><i class="dot"></i><b>${esc(t.nome)}</b><span class="st ${ok?'ok':'ba'}">${ok?'Online':'Fora do ar'}</span>
<span class="tm">HTTP ${esc(t.code??'—')}${t.cliente?' · '+esc(t.cliente):''}</span>${t.error?`<div class="te">${esc(t.error)}</div>`:''}
${/^https?:\/\//i.test(t.url||'')?`<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Abrir endpoint de teste ↗</a>`:''}</div>`}).join('')}</div>`
    :'<p class="empty">Nenhum tribunal configurado para este cliente.<br><small>Adicione um item com <code>"cliente": "'+esc(c.core)+'"</code> no TRIBUNAIS_CONFIG.</small></p>')}
function renderSslTab(L){
  const c=findCur(L),body=$('#body'),sub=$('#sub');
  if(!c){setHTML(body,'<p class="empty">Cliente não encontrado.</p>');return}
  if(S.err.ssl&&!(S.ssl||[]).length){sub.textContent='';setHTML(body,`<p class="empty c-ba">Erro ao carregar certificados: ${esc(S.em.ssl||'erro')}<br><button class="btn sm" data-retry="ssl">Tentar novamente</button></p>`);return}
  if(S.ssl===undefined){sub.textContent='Consultando…';setHTML(body,'<p class="empty">Carregando…</p>');return}
  const l=c.ssl.slice().sort((a,b)=>(sslNum(a)?a.dias_restantes:1e9)-(sslNum(b)?b.dias_restantes:1e9));
  const al=l.filter(s=>sslNum(s)&&s.dias_restantes<SSL_ALERT).length;
  sub.textContent=l.length?`${l.length} certificado(s) monitorado(s)${al?` · ${al} com menos de ${SSL_ALERT} dias`:' · nenhum em alerta'}`:'';
  const fd=v=>{if(v==null||v==='')return'—';if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return esc(v);const d=new Date(v);return isNaN(d)?esc(v):esc(d.toLocaleDateString('pt-BR'))};
  setHTML(body,l.length?`<div class="certs">${l.map(s=>{
    if(!sslNum(s))return`<div class="cbox"><span class="st mu" style="align-self:flex-start">Sem resposta</span><div class="host">${esc(s.host)}</div><div class="c-ba" style="font-size:12.5px;overflow-wrap:anywhere">${esc(s.erro||'Falha ao verificar o certificado')}</div></div>`;
    const d=s.dias_restantes,k=sslK(d);
    return`<div class="cbox"><span class="st ${k}" style="align-self:flex-start">${d<SSL_ALERT?'Renovar agora':'Válido'}</span>
<div class="host">${esc(s.host)}</div><div class="days c-${k}">${esc(d)} <small>dias para renovação</small></div>
<dl class="kv"><dt>Válido até</dt><dd>${fd(s.validade)}</dd><dt>Alerta</dt><dd>quando faltar menos de ${SSL_ALERT} dias</dd></dl></div>`}).join('')}</div>`
    :`<p class="empty">Nenhuma URL deste cliente está na lista de certificados monitorados.<br><small>Inclua a URL na lista <code>sites</code> do searchcertify.py.</small></p>`)}
async function load(t){
  tab=t;
  paintDrawerHead();
  if(t==='trib'){renderTribTab();return}
  if(t==='ssl'){renderSslTab();return}
  const body=$('#body'),sub=$('#sub'),u=DT[t](cur);
  if(!u){sub.textContent='';setHTML(body,'<p class="empty">Detalhamento indisponível.</p>');return}
  const key=u,hit=DC.get(key);let d;
  if(hit&&Date.now()-hit.t<60000)d=hit.d;
  else{
    sub.textContent='Consultando…';
    setHTML(body,'<p class="empty">Carregando…</p>');
    try{d=await j(u,60000);DC.set(key,{t:Date.now(),d})}
    catch(e){setHTML(body,`<p class="empty c-ba">Erro: ${esc(e.message)}<br><button class="btn sm" id="retry">Tentar novamente</button></p>`);return}
  }
  if(!cur||tab!==t||DT[t](cur)!==key)return;

  // ── Gauges de infraestrutura (CPU/Memória) — só na aba Expedientes não cadastrados ──
  const gaugeHtml=t==='pend'?`<div class="gauges">
      <div class="cbox gauge" id="g-cpu"><h4>CPU · 24h</h4><div class="sh" style="height:120px;width:100%"></div></div>
      <div class="cbox gauge" id="g-mem"><h4>Memória · 24h</h4><div class="sh" style="height:120px;width:100%"></div></div>
    </div>`:'';
  const rows=d.processos||d.rotinas||[];
  sub.textContent=`${nf(d.total??rows.length)} registro(s)${d.cached?' · ⚡ cache':''}`;
  if(!rows.length)setHTML(body,gaugeHtml+'<p class="empty">Nenhum registro.</p>');
  else{
    const cols=Object.keys(rows[0]).filter(c=>c!=='content');
    const pr=PR[t].filter(c=>cols.includes(c));
    const O=pr.concat(cols.filter(c=>!pr.includes(c)));
    const M=300;
    setHTML(body,gaugeHtml+
      `<div class="tw"><table><thead><tr>${O.map(c=>`<th>${esc(c.replace(/_/g,' '))}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0,M).map(r=>`<tr>${O.map(c=>`<td class="${c==='judicial_process_number'?'n':c==='failure_message'?'er':''}">${fv(c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${rows.length>M?`<p class="empty">Mostrando ${M} de ${nf(rows.length)}.</p>`:''}`);
  }
  // ── Carrega histórico Zabbix em paralelo (não bloqueia) ──
  if(t==='pend'){
    const c=findCur();
    if(c){
      fetch(`/api/zabbix/history/${encodeURIComponent(c.name)}?hours=24`)
        .then(r=>r.ok?r.json():null)
        .then(h=>{if(!h)return;renderGauge('g-cpu',h.cpu,'CPU','%');renderGauge('g-mem',h.memory,'Memória','%')})
        .catch(()=>{});
    }
  }
}

/* ───────── alertas, período, eventos ───────── */
let ac;function alerta(n){toast('🔴 Rotina com problema: '+n.slice(0,4).join(', ')+(n.length>4?'…':''),'ba',12000);if(mute)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.start();o.stop(ac.currentTime+.6)}catch(_){}}
function toast(m,k='',ms=5000){const d=document.createElement('div');d.className=k;d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms)}
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function applyPer(a,b){
  a?(sessionStorage.setItem('spa_inicio',ymd(a)),sessionStorage.setItem('spa_fim',ymd(b))):(sessionStorage.removeItem('spa_inicio'),sessionStorage.removeItem('spa_fim'));
  DC.clear();['resumo','blank'].forEach(k=>{S[k]=undefined;S.err[k]=0});render();run('resumo');run('blank')}
function setPer(v){P=v;const n=new Date();let a=null,b=n;
  if(v==='hoje')a=n;
  else if(v==='semana')a=new Date(n-6*864e5);
  else if(v==='30d')a=new Date(n-29*864e5);
  else if(v==='mes')a=new Date(n.getFullYear(),n.getMonth(),1);
  else if(v==='mesant'){a=new Date(n.getFullYear(),n.getMonth()-1,1);b=new Date(n.getFullYear(),n.getMonth(),0)}
  $('#d1').value=a?ymd(a):'';$('#d2').value=a?ymd(b):'';$('#rng').dataset.on='false';
  applyPer(a,b)}
$('#per').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#per button').forEach(x=>x.setAttribute('aria-pressed',x===b));setPer(b.dataset.v)};
/* período personalizado */
$('#d1').max=$('#d2').max=ymd(new Date());
$('#dgo').onclick=()=>{
  const a=$('#d1').value,b=$('#d2').value||a;
  if(!a){toast('Escolha a data inicial','wa');$('#d1').focus();return}
  if(b<a){toast('A data final não pode ser anterior à inicial','ba');return}
  const dt=x=>{const[y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
  P='custom';$('#d2').value=b;$$('#per button').forEach(x=>x.setAttribute('aria-pressed',false));$('#rng').dataset.on='true';
  applyPer(dt(a),dt(b))};
['#d1','#d2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('#dgo').click()}));
$('#tipo').onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;T=b.dataset.v;render()};
$('#kpis').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;F=F===b.dataset.f?'ALL':b.dataset.f;render()};
$('#sort').value=SORTS[SORT]?SORT:'sev';
$('#sort').onchange=e=>{SORT=e.target.value;lsSet('spa:sort',SORT);render()};
$('#grid').onclick=e=>{const c=e.target.closest('.cc[data-p]');c&&open(c.dataset.p)};
$('#grid').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.cc[data-p]');if(c){e.preventDefault();open(c.dataset.p)}}};
$('#alertPills').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-more')){alertsAll=!alertsAll;render();return}open(b.dataset.open,b.dataset.tab)};
$('#tabs').onclick=e=>{const b=e.target.closest('button[data-t]');b&&cur&&load(b.dataset.t)};
$('#body').onclick=e=>{if(e.target.id==='retry'){DC.delete(DT[tab](cur));load(tab)}};
$('#ov').onclick=$('#x').onclick=close;
document.addEventListener('click',e=>{
  if(e.target.closest('[data-clear]')){F='ALL';T='ALL';Q='';$('#q').value='';render();return}
  const b=e.target.closest('[data-retry]');if(!b)return;const k=b.dataset.retry;
  (k==='all'?Object.keys(SRC).filter(x=>S.err[x]):[k]).forEach(x=>{S.err[x]=0;S.em[x]='';run(x)});render()});
$('#rf').onclick=()=>{DC.clear();all();toast('Atualizando…')};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
const paintMute=()=>{const b=$('#mute');b.innerHTML=mute?ICON.off:ICON.bell;b.setAttribute('aria-pressed',mute);b.setAttribute('aria-label',mute?'Som de alerta desligado':'Som de alerta ligado')};
$('#mute').onclick=()=>{mute=!mute;lsSet('spa:mute',mute?'1':'0');paintMute()};
paintMute();
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{Q=e.target.value;render()},120)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();else if(e.key==='/'&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});

/* ───────── ciclo de vida ───────── */
const clk=$('#clock');
const tickClock=()=>{clk.textContent=new Date().toLocaleTimeString('pt-BR')};
tickClock();setInterval(tickClock,1000);
setInterval(()=>{
  if(document.hidden)return;
  const n=Date.now();
  for(const k in SRC){
    // rotina e tribunais chegam via SSE
    if(k==='rotina'||k==='trib')continue;
    if(!busy[k]&&n-(S.t[k]||0)>SRC[k].every*1000)run(k);
  }
},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=Date.now();for(const k in SRC)if(n-(S.t[k]||0)>SRC[k].every*1000)run(k)}});
sessionStorage.removeItem('spa_inicio');sessionStorage.removeItem('spa_fim');

/* ─── SSE (tempo real) ─── */
const setConn=(cls,txt)=>{$('#conn').innerHTML=`<i class="${cls}"></i>${txt}`};
let es;
function connectSSE(){
  if(es)try{es.close()}catch(_){}
  es=new EventSource('/api/stream');
  es.onopen=()=>setConn('ok','tempo real');
  es.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(Array.isArray(d.tribunais)){S.trib=d.tribunais;S.t.trib=Date.now()}
      if(Array.isArray(d.rotina)){
        // merge por prefix, mantendo os campos que a SSE não traz
        const byP=new Map((S.rotina||[]).map(r=>[r.prefix,r]));
        d.rotina.forEach(r=>{const old=byP.get(r.prefix)||{};byP.set(r.prefix,{...old,...r})});
        S.rotina=[...byP.values()];S.t.rotina=Date.now();
      }
      render();
    }catch(_){}
  };
  es.onerror=()=>{
    setConn('er','reconectando…');
    try{es.close()}catch(_){}
    // Fallback: busca uma vez via REST enquanto o SSE não volta
    run('rotina');run('trib');
    setTimeout(connectSSE,5000);
  };
}
connectSSE();
hydrate();render();all();   // 1) pinta o último snapshot na hora  2) atualiza todas as fontes em paralelo
})();
