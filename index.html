<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle - Processos SPA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --pge: #f472b6;
            --pgm: #4ade80;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .filters { display: flex; gap: 10px; }
        button {
            background: var(--card);
            border: 1px solid #334155;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button.active { background: var(--accent); color: var(--bg); font-weight: bold; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--accent);
        }
        .card.PGE { border-color: var(--pge); }
        .card.PGM { border-color: var(--pgm); }
        .card h3 { margin: 0; font-size: 14px; color: #94a3b8; }
        .card .val { font-size: 24px; font-weight: 700; margin-top: 10px; }
        .chart-container { background: var(--card); padding: 20px; border-radius: 12px; }
        /* Estilo da Modal */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0; top: 0; width: 100%; height: 100%; 
    background-color: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
}
.modal-content {
    background-color: var(--card);
    margin: 5% auto;
    padding: 20px;
    border-radius: 15px;
    width: 80%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.close { color: #aaa; float: right; font-size: 28px; cursor: pointer; }
.close:hover { color: var(--accent); }

/* Tabela de Erros */
table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #cbd5e1; }
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
th { background-color: #0f172a; color: var(--accent); }
tr:hover { background-color: #2d3a4f; }
.error-msg { color: #f87171; font-weight: 600; }
    </style>
</head>
<body>
<div id="errorModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Detalhes de Erros</h2>
        <div id="modalBody">Carregando detalhes...</div>
    </div>
</div>
<div class="header">
    <h1>Monitoramento de expedientes</h1>
    <div class="filters">
        
        <button class="active" onclick="filterData('ALL', this)">Todos</button>
        <button onclick="filterData('PGE', this)">PGE (Estados)</button>
        <button onclick="filterData('PGM', this)">PGM (Municípios)</button>
    </div>
</div>

<div class="stats-grid" id="statsGrid">
    </div>

<div class="chart-container">
    <canvas id="mainChart" height="100"></canvas>
</div>

<script>
   let rawData = [];
    let chartInstance = null;

    // Função principal de busca
    async function fetchData() {
        console.log("Atualizando dados...");
        try {
            // Adicionamos um timestamp para evitar cache do navegador
            const response = await fetch(`http://127.0.0.1:8000/processos/resumo?t=${Date.now()}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                rawData = data;
                // Mantém o filtro atual (PGE, PGM ou ALL) ao atualizar
                const activeBtn = document.querySelector('button.active').innerText;
                const filter = activeBtn.includes('PGE') ? 'PGE' : activeBtn.includes('PGM') ? 'PGM' : 'ALL';
                renderDashboard(filter);
            }
        } catch (error) {
            console.error("Erro ao carregar API:", error);
            // O fallback permanece apenas para a primeira carga se falhar
            if (rawData.length === 0) {
                rawData = [
                    {instancia: "Erro de Conexão", prefixo: "!", status: "error", total_pendentes: 0}
                ];
                renderDashboard('ALL');
            }
        }
    }

    // Configura o Tempo Real (Polling)
    // 300000 ms = 5 minutos (recomendado para 31 instâncias)
    const INTERVALO_ATUALIZACAO = 30000; 
    
    // Inicia a primeira carga
    fetchData();

    // Define o intervalo para repetir a função
    setInterval(fetchData, INTERVALO_ATUALIZACAO);

    function filterData(type, btn) {
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDashboard(type);
    }

  function renderDashboard(filter) {
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = '';

    const filtered = rawData.filter(item => {
        if (filter === 'ALL') return true;
        return item.instancia.startsWith(filter);
    });

    filtered.forEach(item => {
        const type = item.instancia.startsWith('PGE') ? 'PGE' : 'PGM';
        // Adicionamos o cursor pointer e a chamada openDetails
        grid.innerHTML += `
            <div class="card ${type}" style="cursor:pointer" onclick="openDetails('${item.prefixo}', '${item.instancia}')">
                <h3>${item.instancia}</h3>
                <div class="val">${item.total_pendentes.toLocaleString()} <small>pendentes</small></div>
                <div style="font-size: 10px; color: ${item.status === 'ok' ? '#4ade80' : '#f87171'}">
                    Status: ${item.status.toUpperCase()}
                </div>
            </div>
        `;
    });
    updateChart(filtered);
}

// Nova função para buscar detalhes e abrir a modal
async function openDetails(prefix, name) {
    const modal = document.getElementById('errorModal');
    const body = document.getElementById('modalBody');
    const title = document.getElementById('modalTitle');
    
    modal.style.display = "block";
    title.innerText = `Processos Pendentes: ${name}`;
    body.innerHTML = "Consultando Metabase... aguarde.";

    try {
        const response = await fetch(`http://127.0.0.1:8000/processos/detalhes/${prefix}`);
        const result = await response.json();

        if (!result.processos || result.processos.length === 0) {
            body.innerHTML = "<p>Nenhum erro detalhado encontrado ou instância sem dados.</p>";
            return;
        }

        // Criando a tabela com os seus campos específicos
        let html = `<table>
            <thead>
                <tr>
                    <th>Número do Processo</th>
                    <th>Mensagem de Falha</th>
                    <th>Disponível em</th>
                    <th>ID Procedure</th>
                    <th>Criado em</th>
                    <th>Identificador</th>
                </tr>
            </thead>
            <tbody>`;

        result.processos.forEach(p => {
            html += `
                <tr>
                    <td><strong>${p.judicial_process_number || 'N/A'}</strong></td>
                    <td class="error-msg">${p.failure_message || 'Sem mensagem'}</td>
                    <td>${p.available_at || 'Vazio'}</td>
                    <td>${p.procedure_id || 'Vazio'}</td>
                    <td>${p.created_at || 'Vazio'}</td>
                    <td>${p.identifier || 'Vazio'}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        body.innerHTML = html;

    } catch (error) {
        body.innerHTML = `<p style="color:red">Erro ao conectar com a API: ${error.message}</p>`;
    }
}

function closeModal() {
    document.getElementById('errorModal').style.display = "none";
}

// Fechar modal ao clicar fora dela
window.onclick = function(event) {
    const modal = document.getElementById('errorModal');
    if (event.target == modal) closeModal();
}

    function updateChart(data) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(i => i.instancia),
                datasets: [{
                    label: 'Processos Pendentes',
                    data: data.map(i => i.total_pendentes),
                    backgroundColor: data.map(i => i.instancia.startsWith('PGE') ? '#f472b6' : '#4ade80'),
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#334155' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    fetchData();
</script>
</body>
</html>
